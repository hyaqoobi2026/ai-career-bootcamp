     self._prev = set(_children); self._op = _op\n    def __repr__(self): return f\"Value(data={self.data}, grad={self.grad})\"\n    def __add__(self, other):\n        other = other if isinstance(other, Value) else Value(other)\n        out = Value(self.data + other.data, (self, other), '+')\n        def _b(): self.grad += out.grad; other.grad += out.grad\n        out._backward = _b; return out\n    def __mul__(self, other):\n        other = other if isinstance(other, Value) else Value(other)\n        out = Value(self.data * other.data, (self, other), '*')\n        def _b():\n            self.grad += other.data * out.grad\n            other.grad += self.data * out.grad\n        out._backward = _b; return out\n    def __pow__(self, k):\n        out = Value(self.data ** k, (self,), f'**{k}')\n        def _b(): self.grad += k * (self.data ** (k-1)) * out.grad\n        out._backward = _b; return out\n    def __neg__(self): return self * -1\n    def __sub__(self, other): return self + (-(other if isinstance(other, Value) else Value(other)))\n    def __rsub__(self, other): return Value(other) + (-self)\n    def tanh(self):\n        t = math.tanh(self.data); out = Value(t, (self,), 'tanh')\n        def _b(): self.grad += (1 - t**2) * out.grad\n        out._backward = _b; return out\n    def backward(self):\n        topo, seen = [], set()\n        def build(v):\n            if v not in seen:\n                seen.add(v)\n                for c in v._prev: build(c)\n                topo.append(v)\n        build(self); self.grad = 1.0\n        for n in reversed(topo): n._backward()\n    __radd__ = __add__\n    __rmul__ = __mul__\n\nclass Neuron:\n    def __init__(self, nin, rng):\n        self.w = [Value(rng.uniform(-1,1)) for _ in range(nin)]\n        self.b = Value(0.0)\n    def __call__(self, x):\n        act = sum((wi*xi for wi,xi in zip(self.w,x)), self.b)\n        return act.tanh()\n    def parameters(self): return self.w + [self.b]\n\nclass Layer:\n    def __init__(self, nin, nout, rng):\n        self.neurons = [Neuron(nin, rng) for _ in range(nout)]\n    def __call__(self, x):\n        outs = [n(x) for n in self.neurons]\n        return outs[0] if len(outs) == 1 else outs\n    def parameters(self): return [p for n in self.neurons for p in n.parameters()]\n\nclass MLP:\n    def __init__(self, nin, nouts, seed=0):\n        rng = random.Random(seed)\n        sz = [nin] + list(nouts)\n        self.layers = [Layer(sz[i], sz[i+1], rng) for i in range(len(nouts))]\n    def __call__(self, x):\n        for l in self.layers: x = l(x)\n        return x\n    def parameters(self): return [p for l in self.layers for p in l.parameters()]\n\ndef train(model, xs, ys, steps=100, lr=0.05):\n    losses = []\n    for _ in range(steps):\n        preds = [model(x) for x in xs]\n        loss = sum(((p - t)**2 for p, t in zip(preds, ys)), Value(0.0))\n        losses.append(loss.data)\n        for p in model.parameters(): p.grad = 0.0\n        loss.backward()\n        for p in model.parameters(): p.data -= lr * p.grad\n    return losses"},"d18-deep":{"title":"Extend micrograd \u2014 exp, log, ReLU, division","brief":"## Not from the video\n\nKarpathy's version has tanh. You are adding four more operations yourself, from\nthe derivatives, with no reference to follow. This is the difference between\nhaving watched a lecture and having understood it.\n\n| operation | derivative | passes back |\n|---|---|---|\n| `exp(x)` | `e\u02e3` | `out.data * out.grad` |\n| `log(x)` | `1/x` | `(1/x) * out.grad` |\n| `relu(x)` | 1 if x>0 else 0 | `(out.data > 0) * out.grad` |\n| `a / b` | \u2014 | implement as `a * b**-1` |\n\n## The one that is nearly free\n\nDivision needs no new backward code at all \u2014 if `__pow__` handles negative\nexponents, then `a / b` is `a * b**(-1)` and the existing rules cover it.\n\n**Reusing primitives instead of adding special cases is how real frameworks stay\nsmall.** PyTorch does the same thing.\n\n## Note on relu's derivative at zero\n\nIt is undefined \u2014 there is a kink. Every framework picks a convention; use 0.\nIt essentially never matters in practice, and knowing that it is a convention\nrather than a fact is the point.\n\n## Your task\n\nPaste your Value class, add `exp`, `log`, `relu`, `__truediv__` and\n`__rtruediv__`, all differentiating correctly.","starter":"import math\n\n# paste your Value class, then add exp / log / relu / __truediv__ / __rtruediv__","tests":"import math\neps = 1e-6\ndef numgrad(fn, x0):\n    return (fn(x0+eps) - fn(x0-eps)) / (2*eps)\n\n# exp\na = Value(0.7); e = a.exp(); e.backward()\ncheck(abs(e.data - math.exp(0.7)) < 1e-9, \"exp value wrong\")\ncheck(abs(a.grad - math.exp(0.7)) < 1e-6, f\"d(exp)/dx = exp(x); got {a.grad}\")\n\n# log\nb = Value(2.5); l = b.log(); l.backward()\ncheck(abs(l.data - math.log(2.5)) < 1e-9, \"log value wrong\")\ncheck(abs(b.grad - 1/2.5) < 1e-6, f\"d(log)/dx = 1/x = 0.4; got {b.grad}\")\n\n# relu, both sides\np = Value(3.0); rp = p.relu(); rp.backward()\ncheck(abs(rp.data - 3.0) < 1e-12 and abs(p.grad - 1.0) < 1e-12, \"relu positive side wrong\")\nn = Value(-3.0); rn = n.relu(); rn.backward()\ncheck(abs(rn.data) < 1e-12 and abs(n.grad) < 1e-12, \"relu negative side must give 0 value and 0 grad\")\n\n# division\nc, d = Value(6.0), Value(3.0)\nq = c / d; q.backward()\ncheck(abs(q.data - 2.0) < 1e-9, \"6/3 should be 2\")\ncheck(abs(c.grad - 1/3) < 1e-6, f\"d(c/d)/dc = 1/d = 0.333; got {c.grad}\")\ncheck(abs(d.grad + 6/9) < 1e-6, f\"d(c/d)/dd = -c/d^2 = -0.667; got {d.grad}\")\n\nr = 12 / Value(4.0)\ncheck(abs(r.data - 3.0) < 1e-9, \"number / Value must work \u2014 you need __rtruediv__\")\n\n# a composite expression checked numerically\ndef f(t):\n    v = Value(t)\n    return (((v*2).exp() + Value(1.0)).log() / (v + Value(3.0))).data\nz = Value(0.4)\nout = (((z*2).exp() + Value(1.0)).log() / (z + Value(3.0)))\nout.backward()\ncheck(abs(z.grad - numgrad(f, 0.4)) < 1e-4,\n      f\"composite gradient {z.grad:.8f} vs numerical {numgrad(f,0.4):.8f}\")\n\n# sigmoid built from your primitives\ndef sigmoid(v): return 1 / (1 + (-v).exp())\ns_in = Value(0.3); s = sigmoid(s_in); s.backward()\nexpect = 1/(1+math.exp(-0.3))\ncheck(abs(s.data - expect) < 1e-9, \"sigmoid built from exp/div is wrong\")\ncheck(abs(s_in.grad - expect*(1-expect)) < 1e-6,\n      \"sigmoid gradient should be s(1-s) and follow automatically from your primitives\")","hints":["`exp`: `out = Value(math.exp(self.data), (self,), 'exp')` and `self.grad += out.data * out.grad`.","`log`: `self.grad += (1/self.data) * out.grad`.","`relu`: value is `max(0, self.data)`; grad is `(out.data > 0) * out.grad`.","`__truediv__(self, other)`: `return self * other**-1`.","For that to work, `__pow__` must accept negative exponents \u2014 it already does if you wrote `self.data ** k`.","`__rtruediv__(self, other)`: `return Value(other) * self**-1`."],"solution":"import math\n\nclass Value:\n    def __init__(self, data, _children=(), _op=''):\n        self.data = float(data); self.grad = 0.0\n        self._backward = lambda: None\n        self._prev = set(_children); self._op = _op\n    def __repr__(self): return f\"Value(data={self.data}, grad={self.grad})\"\n    def __add__(self, other):\n        other = other if isinstance(other, Value) else Value(other)\n        out = Value(self.data + other.data, (self, other), '+')\n        def _b(): self.grad += out.grad; other.grad += out.grad\n        out._backward = _b; return out\n    def __mul__(self, other):\n        other = other if isinstance(other, Value) else Value(other)\n        out = Value(self.data * other.data, (self, other), '*')\n        def _b():\n            self.grad += other.data * out.grad\n            other.grad += self.data * out.grad\n        out._backward = _b; return out\n    def __pow__(self, k):\n        out = Value(self.data ** k, (self,), f'**{k}')\n        def _b(): self.grad += k * (self.data ** (k-1)) * out.grad\n        out._backward = _b; return out\n    def __neg__(self): return self * -1\n    def __sub__(self, other): return self + (-(other if isinstance(other,Value) else Value(other)))\n    def __rsub__(self, other): return Value(other) + (-self)\n    def __truediv__(self, other):\n        other = other if isinstance(other, Value) else Value(other)\n        return self * other**-1\n    def __rtruediv__(self, other): return Value(other) * self**-1\n    def exp(self):\n        out = Value(math.exp(self.data), (self,), 'exp')\n        def _b(): self.grad += out.data * out.grad\n        out._backward = _b; return out\n    def log(self):\n        out = Value(math.log(self.data), (self,), 'log')\n        def _b(): self.grad += (1.0/self.data) * out.grad\n        out._backward = _b; return out\n    def relu(self):\n        out = Value(max(0.0, self.data), (self,), 'relu')\n        def _b(): self.grad += (1.0 if out.data > 0 else 0.0) * out.grad\n        out._backward = _b; return out\n    def tanh(self):\n        t = math.tanh(self.data); out = Value(t, (self,), 'tanh')\n        def _b(): self.grad += (1 - t**2) * out.grad\n        out._backward = _b; return out\n    def backward(self):\n        topo, seen = [], set()\n        def build(v):\n            if v not in seen:\n                seen.add(v)\n                for c in v._prev: build(c)\n                topo.append(v)\n        build(self); self.grad = 1.0\n        for n in reversed(topo): n._backward()\n    __radd__ = __add__\n    __rmul__ = __mul__"},"d19-deep":{"title":"Gradient checking \u2014 proving your engine is right","brief":"## The skill nobody teaches\n\nYou have written an autograd engine. How do you *know* it is correct?\n\nThe answer is a real research technique, and it is the reason you can trust any\nhand-derived gradient: compare against the definition of a derivative.\n\n```\n                f(x + \u03b5) \u2212 f(x \u2212 \u03b5)\n    f'(x)  \u2248   \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n                        2\u03b5\n```\n\nThis is the **central difference**. It is accurate to O(\u03b5\u00b2), while the naive\none-sided version is only O(\u03b5) \u2014 for the same cost of two evaluations, it is far\nbetter. Always use the central form.\n\n## Choosing \u03b5\n\nToo large and you measure the curve, not the tangent. Too small and floating\npoint cancellation destroys you \u2014 subtracting two nearly equal numbers loses\nprecision catastrophically. `1e-5` to `1e-7` is the useful window.\n\n## Compare relatively, not absolutely\n\nAn absolute difference of 0.001 is fine for a gradient of 5000 and a disaster\nfor a gradient of 0.0001. Use **relative error**:\n\n```\n        |analytic \u2212 numerical|\nrel =  \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n        max(|analytic|, |numerical|, tiny)\n```\n\nUnder 1e-7 is excellent. Under 1e-5 is fine. Above 1e-3, you have a bug.\n\n## Your task\n\n`numerical_grad(f, x, eps)`, `rel_error(a, b)`, and `grad_check(expr_fn, xs)`\nwhich builds the expression from Values, runs your `backward()`, and returns the\nworst relative error across all inputs.","starter":"import math\n\n# paste your Value class here\n\ndef numerical_grad(f, x, eps=1e-6):\n    \"\"\"Central difference derivative of scalar f at scalar x.\"\"\"\n    pass\n\ndef rel_error(a, b):\n    \"\"\"Relative error between two numbers, safe when both are ~0.\"\"\"\n    pass\n\ndef grad_check(expr_fn, xs, eps=1e-6):\n    \"\"\"expr_fn takes a list of Values and returns a single Value.\n    xs is a list of floats.\n    Build Values, call expr_fn, backward(), and compare every input's .grad\n    against the numerical derivative. Return the WORST relative error.\"\"\"\n    pass","tests":"import math\n\ncheck(abs(numerical_grad(lambda x: x**2, 3.0) - 6.0) < 1e-5, \"d(x^2)/dx at 3 is 6\")\ncheck(abs(numerical_grad(math.sin, 0.0) - 1.0) < 1e-5, \"d(sin)/dx at 0 is 1\")\ncheck(abs(numerical_grad(math.exp, 1.0) - math.e) < 1e-4, \"d(exp)/dx at 1 is e\")\n\ncheck(rel_error(1.0, 1.0) < 1e-12, \"identical values have zero relative error\")\ncheck(rel_error(0.0, 0.0) < 1e-12, \"rel_error(0,0) must not divide by zero\")\ncheck(abs(rel_error(1.0, 1.1) - 0.1/1.1) < 1e-6 or abs(rel_error(1.0,1.1) - 0.1) < 0.02,\n      \"rel_error should scale by magnitude\")\ncheck(rel_error(1e6, 1e6 + 1.0) < 1e-5, \"a difference of 1 in a million is small relatively\")\n\n# your engine must survive these\nworst = grad_check(lambda v: v[0]*v[1] + v[0], [2.0, -3.0])\ncheck(worst < 1e-5, f\"simple product+sum failed grad check: {worst:.2e}\")\n\nworst = grad_check(lambda v: (v[0]*v[1] + v[2]).tanh(), [2.0, -3.0, 1.0])\ncheck(worst < 1e-5, f\"tanh expression failed grad check: {worst:.2e}\")\n\nworst = grad_check(lambda v: v[0]*v[0]*v[0] + v[0]*v[1], [1.5, 2.0])\ncheck(worst < 1e-5, f\"repeated-use expression failed: {worst:.2e} \"\n      \"(this is the accumulation test \u2014 a += bug shows up here)\")\n\nworst = grad_check(lambda v: ((v[0].exp() + v[1]) / (v[0] + 3.0)).log(), [0.5, 2.0])\ncheck(worst < 1e-4, f\"composite exp/div/log expression failed: {worst:.2e}\")\n\n# a deep chain\ndef deep(v):\n    x = v[0]\n    for _ in range(8): x = (x * 0.9 + 0.1).tanh()\n    return x\ncheck(grad_check(deep, [0.3]) < 1e-4, \"an 8-deep chain should still check out\")","hints":["`numerical_grad`: `(f(x+eps) - f(x-eps)) / (2*eps)`.","`rel_error`: `abs(a-b) / max(abs(a), abs(b), 1e-12)`.","In grad_check, build `vals = [Value(x) for x in xs]`, call `out = expr_fn(vals)`, then `out.backward()`.","For the numerical side, define a helper that rebuilds the whole expression with one input nudged: `expr_fn([Value(x) for x in perturbed]).data`.","Rebuild the Values each time \u2014 a Value already carries a grad from the last pass.","Return `max(...)` over the per-input relative errors."],"solution":"import math\n\nclass Value:\n    def __init__(self, data, _children=(), _op=''):\n        self.data = float(data); self.grad = 0.0\n        self._backward = lambda: None\n        self._prev = set(_children); self._op = _op\n    def __add__(self, other):\n        other = other if isinstance(other, Value) else Value(other)\n        out = Value(self.data + other.data, (self, other), '+')\n        def _b(): self.grad += out.grad; other.grad += out.grad\n        out._backward = _b; return out\n    def __mul__(self, other):\n        other = other if isinstance(other, Value) else Value(other)\n        out = Value(self.data * other.data, (self, other), '*')\n        def _b():\n            self.grad += other.data * out.grad\n            other.grad += self.data * out.grad\n        out._backward = _b; return out\n    def __pow__(self, k):\n        out = Value(self.data ** k, (self,), f'**{k}')\n        def _b(): self.grad += k * (self.data ** (k-1)) * out.grad\n        out._backward = _b; return out\n    def __neg__(self): return self * -1\n    def __sub__(self, o): return self + (-(o if isinstance(o,Value) else Value(o)))\n    def __truediv__(self, o):\n        o = o if isinstance(o, Value) else Value(o)\n        return self * o**-1\n    def __rtruediv__(self, o): return Value(o) * self**-1\n    def exp(self):\n        out = Value(math.exp(self.data), (self,), 'exp')\n        def _b(): self.grad += out.data * out.grad\n        out._backward = _b; return out\n    def log(self):\n        out = Value(math.log(self.data), (self,), 'log')\n        def _b(): self.grad += (1.0/self.data) * out.grad\n        out._backward = _b; return out\n    def tanh(self):\n        t = math.tanh(self.data); out = Value(t, (self,), 'tanh')\n        def _b(): self.grad += (1-t**2) * out.grad\n        out._backward = _b; return out\n    def backward(self):\n        topo, seen = [], set()\n        def build(v):\n            if v not in seen:\n                seen.add(v)\n                for c in v._prev: build(c)\n                topo.append(v)\n        build(self); self.grad = 1.0\n        for n in reversed(topo): n._backward()\n    __radd__ = __add__\n    __rmul__ = __mul__\n\ndef numerical_grad(f, x, eps=1e-6):\n    return (f(x + eps) - f(x - eps)) / (2 * eps)\n\ndef rel_error(a, b):\n    return abs(a - b) / max(abs(a), abs(b), 1e-12)\n\ndef grad_check(expr_fn, xs, eps=1e-6):\n    vals = [Value(x) for x in xs]\n    out = expr_fn(vals)\n    out.backward()\n    worst = 0.0\n    for i in range(len(xs)):\n        def f(t, i=i):\n            pert = list(xs); pert[i] = t\n            return expr_fn([Value(v) for v in pert]).data\n        num = numerical_grad(f, xs[i], eps)\n        worst = max(worst, rel_error(vals[i].grad, num))\n    return worst"},"d20-deep":{"title":"Week-3 rebuild \u2014 micrograd from a blank file","brief":"## The most valuable rebuild in the programme\n\nFrom memory, no references. A complete autograd engine:\n\n- `Value` with `.data`, `.grad`, `._prev`, `._backward`\n- `+`, `*`, `**`, unary `-`, `-`, `/` and the reflected versions\n- `tanh`, `exp`, `relu`\n- `backward()` with topological sort and gradient accumulation\n\nAim for under 150 lines.\n\n## Why this one matters most\n\nIf you can write this from nothing, you understand automatic differentiation \u2014\nwhich means you understand what PyTorch is doing when you call `.backward()`,\nand you will never again treat it as magic.\n\nIt is also a genuinely good thing to be able to say in an interview, and a\nfive-minute whiteboard answer that very few candidates can give.\n\n## The tests\n\nGradient checking against numerical differentiation on several expressions,\nincluding repeated-use graphs that catch the accumulation bug.","starter":"import math\n\n# Blank file. From memory.\n\nclass Value:\n    pass","tests":"import math\n\ndef numgrad(f, x, eps=1e-6): return (f(x+eps) - f(x-eps)) / (2*eps)\ndef rel(a, b): return abs(a-b) / max(abs(a), abs(b), 1e-12)\n\n# basics\na, b = Value(2.0), Value(-3.0)\ncheck(abs((a+b).data + 1.0) < 1e-12, \"addition wrong\")\ncheck(abs((a*b).data + 6.0) < 1e-12, \"multiplication wrong\")\ncheck(abs((a**3).data - 8.0) < 1e-12, \"power wrong\")\ncheck(abs((a-b).data - 5.0) < 1e-12, \"subtraction wrong\")\ncheck(abs((a/b).data + 2/3) < 1e-9, \"division wrong\")\ncheck(abs((3*a).data - 6.0) < 1e-12, \"number * Value needs __rmul__\")\ncheck(abs((3+a).data - 5.0) < 1e-12, \"number + Value needs __radd__\")\ncheck(abs(Value(0.0).tanh().data) < 1e-12, \"tanh(0) = 0\")\ncheck(abs(Value(1.0).exp().data - math.e) < 1e-9, \"exp wrong\")\ncheck(abs(Value(-2.0).relu().data) < 1e-12, \"relu(-2) = 0\")\n\n# gradients, checked numerically\ncases = [\n    (lambda v: v[0]*v[1] + v[0], [2.0,-3.0], \"product plus sum\"),\n    (lambda v: (v[0]*v[1]).tanh(), [0.7,1.3], \"tanh of product\"),\n    (lambda v: v[0]*v[0] + v[0]*v[1] + v[1]**3, [1.5,2.0], \"repeated use / accumulation\"),\n    (lambda v: (v[0].exp() / (v[1] + 4.0)), [0.5,2.0], \"exp over sum\"),\n    (lambda v: (v[0]*2 + 1).relu() * v[1], [0.8,-1.5], \"relu chain\"),\n]\nfor fn, xs, name in cases:\n    vals = [Value(x) for x in xs]\n    out = fn(vals); out.backward()\n    for i in range(len(xs)):\n        def g(t, i=i):\n            p = list(xs); p[i] = t\n            return fn([Value(z) for z in p]).data\n        n_ = numgrad(g, xs[i])\n        check(rel(vals[i].grad, n_) < 1e-4,\n              f\"{name}: input {i} analytic {vals[i].grad:.6f} vs numerical {n_:.6f}\")\n\n# accumulation, explicitly\nz = Value(3.0); (z+z+z).backward()\ncheck(abs(z.grad - 3.0) < 1e-9, f\"a value used three times should accumulate to 3, got {z.grad}\")\n\n# a deep chain must not lose gradient\nx = Value(0.5); y = x\nfor _ in range(20): y = (y*0.95 + 0.05).tanh()\ny.backward()\ndef deep(t):\n    v = Value(t)\n    for _ in range(20): v = (v*0.95 + 0.05).tanh()\n    return v.data\ncheck(rel(x.grad, numgrad(deep, 0.5)) < 1e-3, \"a 20-deep chain should still differentiate correctly\")","hints":["Start with __init__ storing data, grad=0.0, _backward=lambda:None, _prev, _op.","Every operation: compute out, define a closure that does `+=` into the inputs, attach it, return out.","backward(): recursive topological build with a visited set, then seed grad=1.0 and walk reversed.","Do not forget __radd__ and __rmul__, or `3*a` fails.","Division reuses __pow__ with -1. Subtraction reuses __neg__."],"solution":"import math\n\nclass Value:\n    def __init__(self, data, _children=(), _op=''):\n        self.data = float(data); self.grad = 0.0\n        self._backward = lambda: None\n        self._prev = set(_children); self._op = _op\n\n    def __repr__(self): return f\"Value(data={self.data}, grad={self.grad})\"\n\n    def __add__(self, other):\n        other = other if isinstance(other, Value) else Value(other)\n        out = Value(self.data + other.data, (self, other), '+')\n        def _b(): self.grad += out.grad; other.grad += out.grad\n        out._backward = _b; return out\n\n    def __mul__(self, other):\n        other = other if isinstance(other, Value) else Value(other)\n        out = Value(self.data * other.data, (self, other), '*')\n        def _b():\n            self.grad += other.data * out.grad\n            other.grad += self.data * out.grad\n        out._backward = _b; return out\n\n    def __pow__(self, k):\n        out = Value(self.data ** k, (self,), f'**{k}')\n        def _b(): self.grad += k * (self.data ** (k-1)) * out.grad\n        out._backward = _b; return out\n\n    def __neg__(self): return self * -1\n    def __sub__(self, o): return self + (-(o if isinstance(o,Value) else Value(o)))\n    def __rsub__(self, o): return Value(o) + (-self)\n    def __truediv__(self, o):\n        o = o if isinstance(o, Value) else Value(o)\n        return self * o**-1\n    def __rtruediv__(self, o): return Value(o) * self**-1\n\n    def tanh(self):\n        t = math.tanh(self.data); out = Value(t, (self,), 'tanh')\n        def _b(): self.grad += (1 - t**2) * out.grad\n        out._backward = _b; return out\n\n    def exp(self):\n        out = Value(math.exp(self.data), (self,), 'exp')\n        def _b(): self.grad += out.data * out.grad\n        out._backward = _b; return out\n\n    def log(self):\n        out = Value(math.log(self.data), (self,), 'log')\n        def _b(): self.grad += (1.0/self.data) * out.grad\n        out._backward = _b; return out\n\n    def relu(self):\n        out = Value(max(0.0, self.data), (self,), 'relu')\n        def _b(): self.grad += (1.0 if out.data > 0 else 0.0) * out.grad\n        out._backward = _b; return out\n\n    def backward(self):\n        topo, seen = [], set()\n        def build(v):\n            if v not in seen:\n                seen.add(v)\n                for c in v._prev: build(c)\n                topo.append(v)\n        build(self); self.grad = 1.0\n        for n in reversed(topo): n._backward()\n\n    __radd__ = __add__\n    __rmul__ = __mul__"},"d22-deep":{"title":"k-NN and k-means from scratch","brief":"## Two algorithms, one idea\n\nBoth rest entirely on **distance**. They are the simplest useful ML algorithms\nand they expose the assumption every distance-based method makes: that\ncloseness in feature space means similarity in reality.\n\n**k-NN** \u2014 to classify a point, find its k nearest neighbours in the training\nset and take a majority vote. There is no training at all; the \"model\" is the\ndata. This is *lazy learning*.\n\n**k-means** \u2014 to cluster, pick k centres, assign every point to its nearest\ncentre, move each centre to the mean of its members, repeat until nothing\nchanges. Unsupervised: no labels anywhere.\n\n## k-means finds a local optimum, not the best one\n\nThis matters and the tests will catch it. Depending on where the initial centres\nland, k-means can converge to an obviously wrong answer \u2014 two centres splitting\none real cluster while a third centre covers two. It cannot escape, because no\nsingle reassignment improves things from there.\n\nThe standard fix is to **run it several times from different starts and keep the\nbest**, measured by **inertia** \u2014 the total squared distance from each point to\nits assigned centre. Lower is better. scikit-learn does exactly this, ten times,\nby default.\n\nSo your `kmeans` takes `n_init` and returns the best run. This is your first\nencounter with a non-convex optimisation problem, and restarts are the crudest\nand most common defence.\n\n## The curse of dimensionality\n\nIn high dimensions, distances stop discriminating \u2014 the ratio between the\nnearest and farthest point approaches 1, so \"nearest neighbour\" becomes nearly\nmeaningless. You will measure this yourself in the last test.\n\nThis is why raw high-dimensional data usually gets projected down first, and why\nlearned embeddings matter: they are a *learned* low-dimensional space where\ndistance actually means something.\n\n## Your task\n\n`euclidean(a, B)`, `knn_predict(X_train, y_train, X_test, k)`,\n`inertia(X, C, labels)`, and `kmeans(X, k, seed, max_iter, n_init)` returning\n`(centroids, labels)` from the best of `n_init` restarts.","starter":"import numpy as np\n\ndef euclidean(a, B):\n    \"\"\"Distance from point a:(d,) to every row of B:(n,d). Returns (n,).\"\"\"\n    pass\n\ndef knn_predict(X_train, y_train, X_test, k=3):\n    \"\"\"Majority vote of the k nearest neighbours. Returns (m,) labels.\"\"\"\n    pass\n\ndef inertia(X, C, labels):\n    \"\"\"Total squared distance from each point to its assigned centroid.\"\"\"\n    pass\n\ndef kmeans(X, k, seed=0, max_iter=100, n_init=10):\n    \"\"\"Lloyd's algorithm, restarted n_init times; keep the lowest-inertia run.\n    Return (centroids:(k,d), labels:(n,)).\"\"\"\n    pass","tests":"import numpy as np\n\nd = euclidean(np.array([0.,0.]), np.array([[3.,4.],[0.,0.],[1.,0.]]))\ncheck(np.allclose(d, [5.,0.,1.]), f\"euclidean wrong: {d}\")\n\nrng = np.random.default_rng(41)\nXa = rng.normal([-3,-3], 0.6, (60,2)); Xb = rng.normal([3,3], 0.6, (60,2))\nXtr = np.vstack([Xa,Xb]); ytr = np.array([0]*60 + [1]*60)\n\npred = np.asarray(knn_predict(Xtr, ytr, np.array([[-3.,-3.],[3.,3.]]), k=3)).reshape(-1)\ncheck(np.array_equal(pred, [0,1]), f\"k-NN should classify the cluster centres: {pred}\")\ncheck((np.asarray(knn_predict(Xtr,ytr,Xtr,k=3)).reshape(-1)==ytr).mean()>0.97,\n      \"k-NN should be near-perfect on its own well-separated training data\")\n\nXte = np.vstack([rng.normal([-3,-3],0.6,(20,2)), rng.normal([3,3],0.6,(20,2))])\nyte = np.array([0]*20+[1]*20)\ncheck((np.asarray(knn_predict(Xtr,ytr,Xte,k=5)).reshape(-1)==yte).mean()>0.95,\n      \"k-NN should generalise to held-out points\")\n\n# k=1 must reproduce the training labels exactly\ncheck(np.array_equal(np.asarray(knn_predict(Xtr,ytr,Xtr,k=1)).reshape(-1), ytr),\n      \"with k=1 every training point is its own nearest neighbour, so accuracy is 100%\")\n\n# inertia\ncheck(abs(inertia(np.array([[0.,0.],[2.,0.]]), np.array([[0.,0.],[2.,0.]]),\n                  np.array([0,1]))) < 1e-12, \"inertia is 0 when points sit on their centroids\")\ncheck(abs(inertia(np.array([[0.,0.],[2.,0.]]), np.array([[1.,0.]]),\n                  np.array([0,0])) - 2.0) < 1e-9, \"inertia should be 1^2 + 1^2 = 2\")\n\n# k-means on three blobs\ncent_true = np.array([[-5.,0.],[5.,0.],[0.,6.]])\nX3 = np.vstack([rng.normal(c,0.5,(50,2)) for c in cent_true])\nC, lab = kmeans(X3, 3, seed=0, n_init=10)\nC = np.asarray(C); lab = np.asarray(lab).reshape(-1)\ncheck(C.shape == (3,2), f\"centroids should be (3,2), got {C.shape}\")\ncheck(len(np.unique(lab)) == 3, \"all three clusters should be used\")\n\nfound = sorted([tuple(np.round(c,0)) for c in C])\nwant  = sorted([tuple(np.round(c,0)) for c in cent_true])\ncheck(all(min(np.linalg.norm(c-t) for c in C) < 0.5 for t in cent_true),\n      f\"centroids should land near {cent_true.tolist()}, got {np.round(C,2).tolist()}\")\n\n# each cluster should be pure\nfor cl in np.unique(lab):\n    members = np.where(lab==cl)[0]\n    block = members // 50\n    check(len(np.unique(block)) == 1, \"each k-means cluster should contain one true blob\")\n\n# restarts must actually help \u2014 seed 0 alone lands in a bad local optimum here\nCs, ls = kmeans(X3, 3, seed=0, n_init=1)\ncheck(inertia(X3, C, lab) <= inertia(X3, np.asarray(Cs), np.asarray(ls)) + 1e-9,\n      \"10 restarts must never be worse than 1 \u2014 you are not keeping the lowest-inertia run\")\n\n# the curse of dimensionality, measured\ndef contrast(dim):\n    P = rng.normal(0,1,(300,dim))\n    dd = euclidean(P[0], P[1:])\n    return dd.max()/dd.min()\ncheck(contrast(2) > contrast(200),\n      \"the ratio of farthest to nearest distance should SHRINK as dimension grows \u2014 \"\n      \"that is the curse of dimensionality\")","hints":["`euclidean`: `np.sqrt(((B - a)**2).sum(axis=1))`.","For k-NN, `np.argsort(dists)[:k]` gives the nearest indices.","Majority vote: `np.bincount(y_train[idx]).argmax()`.","k-means init: `X[rng.choice(len(X), k, replace=False)]`.","Assign: for each point, the argmin over centroids. Update: `X[labels==j].mean(axis=0)`.","Stop early when the labels stop changing \u2014 that is convergence.","inertia: `sum(((X - C[labels])**2).sum(axis=1))`.","For restarts, loop n_init times using seed+i, compute inertia each time, keep the best."],"solution":"import numpy as np\n\ndef euclidean(a, B):\n    return np.sqrt(((np.asarray(B) - np.asarray(a))**2).sum(axis=1))\n\ndef knn_predict(X_train, y_train, X_test, k=3):\n    out = []\n    for x in np.asarray(X_test):\n        idx = np.argsort(euclidean(x, X_train))[:k]\n        out.append(np.bincount(np.asarray(y_train)[idx].astype(int)).argmax())\n    return np.array(out)\n\ndef inertia(X, C, labels):\n    X = np.asarray(X); C = np.asarray(C); labels = np.asarray(labels)\n    return float(((X - C[labels])**2).sum())\n\ndef _kmeans_once(X, k, seed, max_iter):\n    rng = np.random.default_rng(seed)\n    C = X[rng.choice(len(X), k, replace=False)].astype(float).copy()\n    labels = np.zeros(len(X), dtype=int)\n    for it in range(max_iter):\n        new = np.array([int(np.argmin(euclidean(x, C))) for x in X])\n        if it > 0 and np.array_equal(new, labels): break\n        labels = new\n        for j in range(k):\n            if np.any(labels == j): C[j] = X[labels == j].mean(axis=0)\n    return C, labels\n\ndef kmeans(X, k, seed=0, max_iter=100, n_init=10):\n    X = np.asarray(X, dtype=float)\n    best = None\n    for i in range(n_init):\n        C, lab = _kmeans_once(X, k, seed + i, max_iter)\n        score = inertia(X, C, lab)\n        if best is None or score < best[0]: best = (score, C, lab)\n    return best[1], best[2]"},"d23-deep":{"title":"Decision tree from scratch","brief":"## The algorithm\n\nAsk a yes/no question about one feature that best splits the data, then recurse\non each half. Stop when a node is pure or too small.\n\n## Measuring \"best\"\n\n**Gini impurity** \u2014 the probability of misclassifying a randomly drawn element\nif you labelled it by the node's class distribution:\n\n```\nGini = 1 \u2212 \u03a3 p\u1d62\u00b2\n```\n\nZero when the node is pure. Maximum (0.5 for two classes) when perfectly mixed.\n\nA split's quality is the **weighted** impurity of its children:\n\n```\nGini_split = (n_left/n)\u00b7Gini(left) + (n_right/n)\u00b7Gini(right)\n```\n\nChoose the split that minimises it. Searching every feature and every candidate\nthreshold is brute force and, for small data, completely fine.\n\n## Why trees matter beyond trees\n\nA single deep tree overfits badly \u2014 it can memorise the training set exactly.\nThat weakness is precisely why **ensembles** exist: bagging many trees on\nresampled data (random forests) or fitting trees sequentially to the previous\nerrors (boosting). Gradient boosting is still the strongest method on tabular\ndata, and it is built from exactly this.\n\n## Your task\n\n`gini(y)`, `best_split(X, y)` returning `(feature, threshold, score)`,\n`build_tree(X, y, depth, max_depth, min_samples)`, and `tree_predict(tree, X)`.\nRepresent a leaf as `{\"leaf\": label}` and an internal node as\n`{\"f\": i, \"t\": thr, \"L\": ..., \"R\": ...}` with `L` for `X[:,f] <= thr`.","starter":"import numpy as np\n\ndef gini(y):\n    \"\"\"Gini impurity of a label array. Returns a float.\"\"\"\n    pass\n\ndef best_split(X, y):\n    \"\"\"Return (feature_index, threshold, weighted_gini) minimising impurity,\n    or (None, None, None) if no split improves on the parent.\"\"\"\n    pass\n\ndef build_tree(X, y, depth=0, max_depth=5, min_samples=2):\n    pass\n\ndef tree_predict(tree, X):\n    \"\"\"Return (n,) predicted labels.\"\"\"\n    pass","tests":"import numpy as np\n\ncheck(abs(gini(np.array([1,1,1,1]))) < 1e-12, \"a pure node has gini 0\")\ncheck(abs(gini(np.array([0,0,1,1])) - 0.5) < 1e-12, \"a 50/50 two-class node has gini 0.5\")\ncheck(abs(gini(np.array([0,0,0,1])) - 0.375) < 1e-9, \"gini([0,0,0,1]) = 1-(0.75^2+0.25^2) = 0.375\")\ncheck(gini(np.array([0,1,2])) > gini(np.array([0,0,1])), \"more mixing means higher gini\")\n\n# a split on feature 0 at ~0 is obviously best here\nX = np.array([[-2.,5.],[-1.,3.],[1.,4.],[2.,6.]])\ny = np.array([0,0,1,1])\nf, t, s = best_split(X, y)\ncheck(f == 0, f\"the informative feature is 0, got {f}\")\ncheck(-1.0 <= t < 1.0, f\"threshold should separate -1 from 1, got {t}\")\ncheck(abs(s) < 1e-12, \"this split is perfect, so weighted gini should be 0\")\n\ntree = build_tree(X, y)\ncheck(np.array_equal(np.asarray(tree_predict(tree, X)).reshape(-1), y),\n      \"the tree must fit this trivial data exactly\")\n\n# harder, but learnable\nrng = np.random.default_rng(51)\nXb = rng.normal(0, 1, (300, 4))\nyb = ((Xb[:,0] > 0.3) & (Xb[:,1] < 0.5)).astype(int)\ntb = build_tree(Xb, yb, max_depth=6)\nacc = (np.asarray(tree_predict(tb, Xb)).reshape(-1) == yb).mean()\ncheck(acc > 0.95, f\"a depth-6 tree should fit this rule to >95%, got {acc:.3f}\")\n\nXh = rng.normal(0,1,(150,4))\nyh = ((Xh[:,0] > 0.3) & (Xh[:,1] < 0.5)).astype(int)\ncheck((np.asarray(tree_predict(tb,Xh)).reshape(-1)==yh).mean() > 0.88,\n      \"and should generalise reasonably to unseen data\")\n\n# depth control must actually work\nshallow = build_tree(Xb, yb, max_depth=1)\ndeep    = build_tree(Xb, yb, max_depth=8)\na_s = (np.asarray(tree_predict(shallow,Xb)).reshape(-1)==yb).mean()\na_d = (np.asarray(tree_predict(deep,Xb)).reshape(-1)==yb).mean()\ncheck(a_d > a_s, f\"a deeper tree should fit training data better ({a_d:.3f} vs {a_s:.3f})\")\n\n# a pure node must become a leaf\nleaf = build_tree(np.array([[1.],[2.]]), np.array([1,1]))\ncheck(\"leaf\" in leaf, \"a pure node must be a leaf\")","hints":["`gini`: `_, counts = np.unique(y, return_counts=True); p = counts/len(y); return 1 - (p**2).sum()`.","Candidate thresholds: midpoints between consecutive unique values of a feature.","Skip any split that puts zero samples on one side.","Weighted score: `(nL/n)*gini(yL) + (nR/n)*gini(yR)`.","Stop conditions: pure node, depth >= max_depth, or len(y) < min_samples \u2014 return `{'leaf': majority}`.","For prediction, walk the dict per row: `node = node['L'] if x[node['f']] <= node['t'] else node['R']`."],"solution":"import numpy as np\n\ndef gini(y):\n    y = np.asarray(y)\n    if len(y) == 0: return 0.0\n    _, c = np.unique(y, return_counts=True)\n    p = c / len(y)\n    return float(1.0 - (p**2).sum())\n\ndef best_split(X, y):\n    X = np.asarray(X); y = np.asarray(y)\n    n, d = X.shape\n    best = (None, None, None); bs = gini(y)\n    for f in range(d):\n        vals = np.unique(X[:, f])\n        for i in range(len(vals) - 1):\n            t = (vals[i] + vals[i+1]) / 2.0\n            m = X[:, f] <= t\n            if m.sum() == 0 or (~m).sum() == 0: continue\n            s = m.sum()/n * gini(y[m]) + (~m).sum()/n * gini(y[~m])\n            if s < bs - 1e-12:\n                bs = s; best = (f, float(t), float(s))\n    return best\n\ndef build_tree(X, y, depth=0, max_depth=5, min_samples=2):\n    X = np.asarray(X); y = np.asarray(y)\n    maj = int(np.bincount(y.astype(int)).argmax())\n    if len(np.unique(y)) == 1 or depth >= max_depth or len(y) < min_samples:\n        return {\"leaf\": maj}\n    f, t, _ = best_split(X, y)\n    if f is None: return {\"leaf\": maj}\n    m = X[:, f] <= t\n    return {\"f\": f, \"t\": t,\n            \"L\": build_tree(X[m], y[m], depth+1, max_depth, min_samples),\n            \"R\": build_tree(X[~m], y[~m], depth+1, max_depth, min_samples)}\n\ndef tree_predict(tree, X):\n    out = []\n    for x in np.asarray(X):\n        node = tree\n        while \"leaf\" not in node:\n            node = node[\"L\"] if x[node[\"f\"]] <= node[\"t\"] else node[\"R\"]\n        out.append(node[\"leaf\"])\n    return np.array(out)"},"d24-deep":{"title":"PCA from scratch","brief":"## What PCA does\n\nFinds the directions along which your data varies most, and lets you keep only\nthose. It is the classical answer to the curse of dimensionality you measured on\nMonday.\n\n## The recipe\n\n1. **Centre** the data \u2014 subtract the mean of each feature. This is not optional;\n   PCA without centring finds the direction to the origin, not the direction of\n   variance.\n2. **Covariance matrix** \u2014 `C = X\u1d40X / (n\u22121)` on the centred data. Entry `(i,j)`\n   is how features i and j vary together.\n3. **Eigendecomposition** of C. Eigenvectors are the **principal components** \u2014\n   the directions. Eigenvalues are how much variance lies along each.\n4. **Sort** by eigenvalue descending, keep the top k.\n5. **Project**: `X_centred @ components.T`.\n\n## Why eigenvectors\n\nThe eigenvectors of the covariance matrix are the axes along which the data,\nviewed as a cloud, is longest. The largest eigenvalue is the variance along the\nlongest axis. That is the whole geometric content \u2014 everything else is\nbookkeeping.\n\n## Use `eigh`, not `eig`\n\nThe covariance matrix is symmetric. `np.linalg.eigh` exploits that: it is\nfaster, and it guarantees real eigenvalues in ascending order. `eig` can return\ncomplex values from floating-point noise and will cause confusing bugs.\n\n## Your task\n\n`pca_fit(X, k)` returning `(components:(k,d), mean:(d,), explained_ratio:(k,))`,\n`pca_transform(X, mean, components)`, and `pca_inverse(Z, mean, components)`.","starter":"import numpy as np\n\ndef pca_fit(X, k):\n    \"\"\"Return (components (k,d), mean (d,), explained_variance_ratio (k,)).\n    Components sorted by descending explained variance.\"\"\"\n    pass\n\ndef pca_transform(X, mean, components):\n    \"\"\"Project X onto the components. Returns (n,k).\"\"\"\n    pass\n\ndef pca_inverse(Z, mean, components):\n    \"\"\"Reconstruct back into the original space. Returns (n,d).\"\"\"\n    pass","tests":"import numpy as np\nrng = np.random.default_rng(61)\n\n# data stretched along a known direction\nt = rng.normal(0, 3, 400)\nX = np.column_stack([t, 0.5*t]) + rng.normal(0, 0.05, (400,2)) + np.array([10., -5.])\n\ncomp, mean, ratio = pca_fit(X, 2)\ncomp = np.asarray(comp); mean = np.asarray(mean); ratio = np.asarray(ratio)\n\ncheck(comp.shape == (2,2), f\"components should be (2,2), got {comp.shape}\")\ncheck(np.allclose(mean, X.mean(axis=0)), \"mean must be the per-feature mean of X\")\ncheck(abs(ratio.sum() - 1.0) < 1e-6, f\"explained ratios should sum to 1, got {ratio.sum()}\")\ncheck(ratio[0] > ratio[1], \"components must be sorted by descending variance\")\ncheck(ratio[0] > 0.99, f\"nearly all variance is along one direction; got {ratio[0]:.4f}\")\n\n# the first component points along [1, 0.5] normalised (sign is arbitrary)\nwant = np.array([1.0, 0.5]); want = want/np.linalg.norm(want)\ncheck(min(np.linalg.norm(comp[0]-want), np.linalg.norm(comp[0]+want)) < 0.05,\n      f\"first component should align with [1,0.5] normalised, got {np.round(comp[0],3)}\")\n\ncheck(abs(np.linalg.norm(comp[0]) - 1.0) < 1e-9, \"components must be unit vectors\")\ncheck(abs(comp[0] @ comp[1]) < 1e-9, \"components must be orthogonal\")\n\nZ = np.asarray(pca_transform(X, mean, comp))\ncheck(Z.shape == (400,2), f\"transform should give (400,2), got {Z.shape}\")\ncheck(abs(Z.mean(axis=0)).max() < 1e-9, \"projected data should be centred at 0\")\n\nXr = np.asarray(pca_inverse(Z, mean, comp))\ncheck(np.allclose(Xr, X, atol=1e-8), \"keeping all components must reconstruct X exactly\")\n\n# one component should still reconstruct well here\nc1, m1, r1 = pca_fit(X, 1)\nZ1 = pca_transform(X, m1, c1)\ncheck(np.asarray(Z1).shape == (400,1), \"k=1 should give (400,1)\")\nerr = np.abs(np.asarray(pca_inverse(Z1, m1, c1)) - X).max()\ncheck(err < 0.5, f\"1-component reconstruction error should be small here, got {err:.3f}\")\n\n# centring genuinely matters\nXoff = X + 1000.0\nc2, m2, r2 = pca_fit(Xoff, 1)\ncheck(min(np.linalg.norm(np.asarray(c2)[0]-want), np.linalg.norm(np.asarray(c2)[0]+want)) < 0.05,\n      \"shifting the data must not change the principal direction \u2014 did you centre?\")","hints":["`mean = X.mean(axis=0)` then `Xc = X - mean`.","`C = Xc.T @ Xc / (len(X) - 1)`.","`vals, vecs = np.linalg.eigh(C)` \u2014 vals ascending, vecs in COLUMNS.","Reverse for descending: `order = np.argsort(vals)[::-1]`.","Components as rows: `vecs[:, order].T[:k]`.","`explained_ratio = vals[order][:k] / vals.sum()`.","`transform`: `(X - mean) @ components.T`. `inverse`: `Z @ components + mean`."],"solution":"import numpy as np\n\ndef pca_fit(X, k):\n    X = np.asarray(X, dtype=float)\n    mean = X.mean(axis=0)\n    Xc = X - mean\n    C = Xc.T @ Xc / (len(X) - 1)\n    vals, vecs = np.linalg.eigh(C)\n    order = np.argsort(vals)[::-1]\n    vals = vals[order]; vecs = vecs[:, order]\n    return vecs.T[:k], mean, vals[:k] / vals.sum()\n\ndef pca_transform(X, mean, components):\n    return (np.asarray(X) - np.asarray(mean)) @ np.asarray(components).T\n\ndef pca_inverse(Z, mean, components):\n    return np.asarray(Z) @ np.asarray(components) + np.asarray(mean)"},"d25-deep":{"title":"Build the scikit-learn API yourself","brief":"## Why this exercise instead of importing sklearn\n\nThe scheduled task is a scikit-learn sprint \u2014 do that in VS Code. Here you build\nthe *interface* sklearn uses, because understanding the contract is worth more\nthan memorising the imports, and because every ML library in Python copies it.\n\n## The estimator contract\n\n```\nmodel.fit(X, y)      -> returns self, so calls can chain\nmodel.predict(X)     -> predictions\nmodel.score(X, y)    -> a single number, higher is better\n```\n\nLearned attributes end with an underscore: `coef_`, `classes_`. This is not\ndecoration \u2014 it is how sklearn distinguishes what you configured from what was\nlearned. `n_neighbors` is yours; `classes_` came from the data.\n\n## Why `fit` returns self\n\nSo `model.fit(X, y).predict(X)` works, and so pipelines can chain. A small\ndesign decision with large ergonomic consequences.\n\n## The rule that prevents the worst bug in ML\n\nA transformer learns its parameters from **training data only**, then applies\nthem unchanged to test data. Fitting a scaler on all your data before splitting\nleaks test statistics into training and inflates your score. That is\n**data leakage**, and it is the most common serious mistake in applied ML.\n\nYour `StandardScaler` must store the training mean and standard deviation and\nreuse them.\n\n## Your task\n\n`StandardScaler` with `fit`/`transform`/`fit_transform`, and\n`KNNClassifier(n_neighbors)` with `fit`/`predict`/`score`, plus `train_test_split`.","starter":"import numpy as np\n\nclass StandardScaler:\n    def fit(self, X):\n        \"\"\"Store mean_ and scale_ from X. Return self.\"\"\"\n        pass\n    def transform(self, X):\n        \"\"\"Apply the STORED statistics. Do not recompute.\"\"\"\n        pass\n    def fit_transform(self, X):\n        pass\n\nclass KNNClassifier:\n    def __init__(self, n_neighbors=3):\n        self.n_neighbors = n_neighbors\n    def fit(self, X, y):\n        \"\"\"Store the data and set classes_. Return self.\"\"\"\n        pass\n    def predict(self, X):\n        pass\n    def score(self, X, y):\n        \"\"\"Mean accuracy.\"\"\"\n        pass\n\ndef train_test_split(X, y, test_size=0.25, seed=0):\n    \"\"\"Shuffle then split. Return X_train, X_test, y_train, y_test.\"\"\"\n    pass","tests":"import numpy as np\nrng = np.random.default_rng(71)\n\nX = rng.normal(5, 3, (200, 4))\nsc = StandardScaler()\nout = sc.fit(X)\ncheck(out is sc, \"fit must return self so calls can chain\")\ncheck(hasattr(sc, \"mean_\") and hasattr(sc, \"scale_\"),\n      \"learned attributes must be named mean_ and scale_ with trailing underscores\")\nXs = np.asarray(sc.transform(X))\ncheck(abs(Xs.mean(axis=0)).max() < 1e-9, \"transformed data should have mean 0\")\ncheck(abs(Xs.std(axis=0) - 1).max() < 1e-6, \"transformed data should have std 1\")\n\n# THE LEAKAGE TEST: transform must reuse training statistics\nXtest = rng.normal(50, 3, (50, 4))\nXt = np.asarray(sc.transform(Xtest))\ncheck(abs(Xt.mean(axis=0)).max() > 5,\n      \"transform must apply the TRAINING mean, not recompute on new data \u2014 \"\n      \"if this passes near 0 you have data leakage\")\n\ncheck(np.allclose(np.asarray(StandardScaler().fit_transform(X)), Xs),\n      \"fit_transform should equal fit then transform\")\n\n# knn\nXa = rng.normal([-3,-3], 0.7, (100,2)); Xb = rng.normal([3,3], 0.7, (100,2))\nXk = np.vstack([Xa,Xb]); yk = np.array([0]*100 + [1]*100)\nXtr, Xte, ytr, yte = train_test_split(Xk, yk, test_size=0.25, seed=0)\ncheck(len(Xtr)==150 and len(Xte)==50, f\"split sizes wrong: {len(Xtr)}/{len(Xte)}\")\ncheck(len(ytr)==150 and len(yte)==50, \"y must be split the same way as X\")\ncheck(abs(np.mean(yte) - 0.5) < 0.25, \"the split must be shuffled, not the first 150 rows\")\n\nm = KNNClassifier(n_neighbors=5)\ncheck(m.fit(Xtr, ytr) is m, \"fit must return self\")\ncheck(set(np.asarray(m.classes_).tolist()) == {0,1}, \"classes_ must hold the sorted unique labels\")\ncheck(m.score(Xte, yte) > 0.95, f\"kNN should score >0.95 here, got {m.score(Xte,yte):.3f}\")\ncheck(np.asarray(m.predict(Xte)).shape == (50,), \"predict should return one label per row\")\n\n# chaining must work\ncheck(KNNClassifier(3).fit(Xtr, ytr).score(Xte, yte) > 0.9,\n      \"fit().score() chaining should work\")\n\n# scaling must not break accuracy on already-comparable features\ns2 = StandardScaler().fit(Xtr)\ncheck(KNNClassifier(5).fit(s2.transform(Xtr), ytr).score(s2.transform(Xte), yte) > 0.9,\n      \"the scaled pipeline should still classify well\")","hints":["`self.mean_ = X.mean(axis=0)`, `self.scale_ = X.std(axis=0)`; guard against zero std with `np.where(s==0, 1, s)`.","`transform` must use `self.mean_` and `self.scale_` \u2014 never recompute from its argument.","Every `fit` ends with `return self`.","`self.classes_ = np.unique(y)`.","`score` is `(self.predict(X) == y).mean()`.","For the split: `idx = rng.permutation(len(X))`, then slice at `int(len(X)*(1-test_size))`."],"solution":"import numpy as np\n\nclass StandardScaler:\n    def fit(self, X):\n        X = np.asarray(X, dtype=float)\n        self.mean_ = X.mean(axis=0)\n        s = X.std(axis=0)\n        self.scale_ = np.where(s == 0, 1.0, s)\n        return self\n    def transform(self, X):\n        return (np.asarray(X, dtype=float) - self.mean_) / self.scale_\n    def fit_transform(self, X):\n        return self.fit(X).transform(X)\n\nclass KNNClassifier:\n    def __init__(self, n_neighbors=3):\n        self.n_neighbors = n_neighbors\n    def fit(self, X, y):\n        self.X_ = np.asarray(X, dtype=float)\n        self.y_ = np.asarray(y)\n        self.classes_ = np.unique(self.y_)\n        return self\n    def predict(self, X):\n        out = []\n        for x in np.asarray(X, dtype=float):\n            dist = np.sqrt(((self.X_ - x)**2).sum(axis=1))\n            idx = np.argsort(dist)[:self.n_neighbors]\n            out.append(np.bincount(self.y_[idx].astype(int)).argmax())\n        return np.array(out)\n    def score(self, X, y):\n        return float((self.predict(X) == np.asarray(y)).mean())\n\ndef train_test_split(X, y, test_size=0.25, seed=0):\n    X = np.asarray(X); y = np.asarray(y)\n    rng = np.random.default_rng(seed)\n    idx = rng.permutation(len(X))\n    cut = int(len(X) * (1 - test_size))\n    tr, te = idx[:cut], idx[cut:]\n    return X[tr], X[te], y[tr], y[te]"},"d26-deep":{"title":"Evaluation metrics \u2014 implement every one yourself","brief":"## Why accuracy is usually a lie\n\nA dataset that is 99% negative gives 99% accuracy to a model that always\npredicts negative and has learned nothing. Any time classes are imbalanced \u2014\nfraud, disease, human rights violations \u2014 accuracy is actively misleading.\n\n## The four cells\n\nEverything comes from the confusion matrix:\n\n|                | predicted 0 | predicted 1 |\n|----------------|-------------|-------------|\n| **actual 0**   | TN          | FP          |\n| **actual 1**   | FN          | TP          |\n\n**Precision** = TP/(TP+FP) \u2014 of the things I flagged, how many were real?\n**Recall** = TP/(TP+FN) \u2014 of the real things, how many did I catch?\n**F1** = harmonic mean of the two.\n\n## Which one you choose is a values question, not a technical one\n\nOptimise recall when a miss is worse than a false alarm \u2014 screening for disease,\nor flagging a possible human rights violation where a human reviews everything\nflagged anyway. Optimise precision when a false alarm is expensive or harmful.\n\n**Being able to say which you chose and why is one of the strongest signals you\ncan give in an interview.** Most candidates recite the formulas and never say\nwhat they optimised for.\n\n## ROC-AUC\n\nSweep the threshold from 1 to 0 and plot true-positive rate against\nfalse-positive rate. The area underneath has a beautiful interpretation:\n**the probability that a randomly chosen positive is scored higher than a\nrandomly chosen negative.** 0.5 is random guessing; 1.0 is perfect ranking.\n\nIt is threshold-independent, which makes it a measure of *ranking* quality\nrather than of any particular decision rule.\n\n## Your task\n\n`confusion_matrix`, `precision`, `recall`, `f1`, `accuracy`, and `roc_auc`.\nHandle division by zero by returning 0.0.","starter":"import numpy as np\n\ndef confusion_matrix(y_true, y_pred):\n    \"\"\"Return (tn, fp, fn, tp) as ints.\"\"\"\n    pass\n\ndef accuracy(y_true, y_pred): pass\ndef precision(y_true, y_pred): pass\ndef recall(y_true, y_pred): pass\ndef f1(y_true, y_pred): pass\n\ndef roc_auc(y_true, scores):\n    \"\"\"Area under the ROC curve. y_true is 0/1, scores are continuous.\"\"\"\n    pass","tests":"import numpy as np\n\nyt = np.array([0,0,0,0,1,1,1,1])\nyp = np.array([0,0,1,1,0,1,1,1])\ntn, fp, fn, tp = confusion_matrix(yt, yp)\ncheck((tn,fp,fn,tp) == (2,2,1,3), f\"confusion matrix wrong: got {(tn,fp,fn,tp)}, want (2,2,1,3)\")\n\ncheck(abs(accuracy(yt,yp) - 5/8) < 1e-9, \"accuracy = (tn+tp)/n = 0.625\")\ncheck(abs(precision(yt,yp) - 3/5) < 1e-9, \"precision = tp/(tp+fp) = 0.6\")\ncheck(abs(recall(yt,yp) - 3/4) < 1e-9, \"recall = tp/(tp+fn) = 0.75\")\ncheck(abs(f1(yt,yp) - 2*0.6*0.75/(0.6+0.75)) < 1e-9, \"f1 is the harmonic mean\")\n\n# the imbalance trap, made concrete\nyi = np.array([0]*99 + [1])\nlazy = np.zeros(100, dtype=int)\ncheck(abs(accuracy(yi, lazy) - 0.99) < 1e-9, \"the always-negative model gets 99% accuracy\")\ncheck(abs(recall(yi, lazy)) < 1e-12, \"...and 0% recall \u2014 which is what actually matters here\")\ncheck(abs(precision(yi, lazy)) < 1e-12, \"precision must return 0.0 rather than divide by zero\")\ncheck(abs(f1(yi, lazy)) < 1e-12, \"f1 must be 0.0, not nan\")\n\n# perfect and inverted\ncheck(abs(f1(yt, yt) - 1.0) < 1e-9, \"a perfect prediction has f1 = 1\")\ncheck(abs(recall(np.array([1,1]), np.array([0,0]))) < 1e-12, \"no true positives means recall 0\")\n\n# roc-auc\ncheck(abs(roc_auc(np.array([0,0,1,1]), np.array([0.1,0.2,0.8,0.9])) - 1.0) < 1e-9,\n      \"perfectly ranked scores give AUC 1.0\")\ncheck(abs(roc_auc(np.array([0,0,1,1]), np.array([0.9,0.8,0.2,0.1]))) < 1e-9,\n      \"perfectly inverted ranking gives AUC 0.0\")\ncheck(abs(roc_auc(np.array([0,1,0,1]), np.array([0.5,0.5,0.5,0.5])) - 0.5) < 1e-9,\n      \"all-equal scores give AUC 0.5 \u2014 ties count as half\")\n\nrng = np.random.default_rng(81)\ny = np.array([0]*400 + [1]*400)\ns = np.concatenate([rng.normal(0,1,400), rng.normal(2,1,400)])\na = roc_auc(y, s)\ncheck(0.85 < a < 0.96, f\"two normals 2 sd apart should give AUC around 0.92, got {a:.3f}\")\ncheck(abs(roc_auc(y, s*3 + 100) - a) < 1e-9,\n      \"AUC depends only on the RANKING \u2014 a monotonic rescale must not change it\")","hints":["`tp = int(((y_true==1)&(y_pred==1)).sum())`, and similarly for the other three.","Guard every division: `return tp/(tp+fp) if (tp+fp) > 0 else 0.0`.","f1 is `2*p*r/(p+r)` \u2014 and must return 0.0 when p+r is 0.","For AUC, the rank-based formula is easiest and handles ties correctly.","Use `scipy`-free ranking: `order = np.argsort(scores)`, then assign average ranks to tied groups.","AUC = (sum of ranks of positives \u2212 n_pos(n_pos+1)/2) / (n_pos \u00b7 n_neg)."],"solution":"import numpy as np\n\ndef confusion_matrix(y_true, y_pred):\n    yt = np.asarray(y_true); yp = np.asarray(y_pred)\n    tn = int(((yt==0)&(yp==0)).sum()); fp = int(((yt==0)&(yp==1)).sum())\n    fn = int(((yt==1)&(yp==0)).sum()); tp = int(((yt==1)&(yp==1)).sum())\n    return tn, fp, fn, tp\n\ndef accuracy(y_true, y_pred):\n    tn, fp, fn, tp = confusion_matrix(y_true, y_pred)\n    n = tn+fp+fn+tp\n    return float((tn+tp)/n) if n else 0.0\n\ndef precision(y_true, y_pred):\n    _, fp, _, tp = confusion_matrix(y_true, y_pred)\n    return float(tp/(tp+fp)) if (tp+fp) else 0.0\n\ndef recall(y_true, y_pred):\n    _, _, fn, tp = confusion_matrix(y_true, y_pred)\n    return float(tp/(tp+fn)) if (tp+fn) else 0.0\n\ndef f1(y_true, y_pred):\n    p = precision(y_true, y_pred); r = recall(y_true, y_pred)\n    return float(2*p*r/(p+r)) if (p+r) else 0.0\n\ndef roc_auc(y_true, scores):\n    y = np.asarray(y_true); s = np.asarray(scores, dtype=float)\n    n_pos = int((y==1).sum()); n_neg = int((y==0).sum())\n    if n_pos == 0 or n_neg == 0: return 0.0\n    order = np.argsort(s, kind=\"mergesort\")\n    ranks = np.empty(len(s), dtype=float)\n    i = 0\n    while i < len(s):\n        j = i\n        while j+1 < len(s) and s[order[j+1]] == s[order[i]]: j += 1\n        avg = (i + j) / 2.0 + 1.0\n        for k in range(i, j+1): ranks[order[k]] = avg\n        i = j + 1\n    return float((ranks[y==1].sum() - n_pos*(n_pos+1)/2) / (n_pos*n_neg))"},"d27-deep":{"title":"GATE 1 \u2014 the month-one assessment","brief":"## Rules\n\n**Three hours. No references. No notes. No previous code. No solution tab.**\n\nIf you open the solution, you have not passed the gate \u2014 you have read an\nanswer. The point of an assessment is information about where you actually are,\nand a result you engineered is worthless information.\n\nA bad result today is genuinely fine. It tells you exactly what to redo in week\nfive, which is worth far more than a green tick you did not earn.\n\n## What to build, from nothing\n\n1. `fit_linear(x, y, lr, steps)` \u2014 single feature, `(w, b, losses)`\n2. `sigmoid(z)` \u2014 overflow-safe\n3. `fit_logistic(X, y, lr, steps)` \u2014 `(W, b, losses)`, cross-entropy\n4. `init_params(d, h, seed)` / `forward(X, p)` / `backward(X, y, p, cache)` \u2014\n   a 2-layer net with tanh hidden and sigmoid output\n5. `train_nn(X, y, h, steps, lr, seed)` \u2014 must solve XOR\n6. `precision(y_true, y_pred)` and `recall(y_true, y_pred)`\n\n## How you are graded\n\nBackprop is verified by **numerical gradient checking** \u2014 every partial\nderivative, to 1e-5. Approximately right will fail.\n\nXOR must be solved exactly.\n\n## After\n\nWhatever the result, write in your repo: which parts came back immediately,\nwhich you had to reconstruct, and which you could not do. That list is your\nweek-five plan.","starter":"import numpy as np\n\n# Three hours. From memory. Nothing open.\n\ndef fit_linear(x, y, lr=0.05, steps=3000): pass\ndef sigmoid(z): pass\ndef fit_logistic(X, y, lr=0.1, steps=3000): pass\ndef init_params(d, h, seed=0): pass\ndef forward(X, p): pass\ndef backward(X, y, p, cache): pass\ndef train_nn(X, y, h=4, steps=6000, lr=0.5, seed=0): pass\ndef predict_nn(X, p): pass\ndef precision(y_true, y_pred): pass\ndef recall(y_true, y_pred): pass","tests":"import numpy as np\nrng = np.random.default_rng(99)\n\n# 1 \u2014 linear regression\nx = rng.uniform(-3,3,250); y = 2.5*x - 1.0 + rng.normal(0,0.1,250)\nw,b,L = fit_linear(x,y,lr=0.05,steps=3000)\ncheck(abs(w-2.5)<0.1 and abs(b+1.0)<0.1, f\"linear: expected w=2.5 b=-1.0, got {w:.3f} {b:.3f}\")\ncheck(len(L)==3000 and L[-1]<L[0], \"linear: losses must be recorded and decrease\")\n\n# 2 \u2014 sigmoid\ncheck(abs(sigmoid(np.array([0.0]))[0]-0.5)<1e-9, \"sigmoid(0)=0.5\")\ncheck(np.all(np.isfinite(sigmoid(np.array([-900.,900.])))), \"sigmoid must not overflow\")\n\n# 3 \u2014 logistic regression\nXl = np.vstack([rng.normal(-2,1,(120,2)), rng.normal(2,1,(120,2))])\nyl = np.concatenate([np.zeros(120), np.ones(120)])\nW,bb,Ll = fit_logistic(Xl,yl,lr=0.1,steps=3000)\ncheck(Ll[-1] < 0.15, f\"logistic: cross-entropy should end under 0.15, got {Ll[-1]:.4f}\")\n\n# 4 \u2014 GRADIENT CHECK on the network\np = init_params(2,5,seed=0)\nXg = rng.normal(0,1,(20,2)); yg = (rng.random((20,1))>0.5).astype(float)\nA2,cache = forward(Xg,p)\ncheck(np.asarray(A2).shape==(20,1) and np.all((A2>0)&(A2<1)),\n      \"forward must return (n,1) probabilities\")\ndef _loss(pp):\n    a = np.clip(forward(Xg,pp)[0],1e-12,1-1e-12)\n    return float(-np.mean(yg*np.log(a)+(1-yg)*np.log(1-a)))\ng = backward(Xg,yg,p,cache); bad=[]\nfor key,gk in [(\"W1\",\"dW1\"),(\"b1\",\"db1\"),(\"W2\",\"dW2\"),(\"b2\",\"db2\")]:\n    for i in range(np.asarray(p[key]).size):\n        pp={k:v.copy() for k,v in p.items()}\n        pp[key].flat[i]+=1e-6; a=_loss(pp)\n        pp[key].flat[i]-=2e-6; c=_loss(pp)\n        num=(a-c)/2e-6; ana=float(np.asarray(g[gk]).flat[i])\n        if abs(num-ana)>1e-5*max(1.0,abs(num)): bad.append(f\"{gk}[{i}]\")\ncheck(not bad, f\"GRADIENT CHECK FAILED on {bad[:5]} \u2014 backprop is not exact\")\n\n# 5 \u2014 XOR\nXx=np.array([[0.,0.],[0.,1.],[1.,0.],[1.,1.]]); yx=np.array([[0.],[1.],[1.],[0.]])\npx,lx = train_nn(Xx,yx,h=4,steps=6000,lr=0.5,seed=0)\ncheck(lx[-1]<0.05, f\"XOR loss should end under 0.05, got {lx[-1]:.4f}\")\ncheck(np.array_equal(np.asarray(predict_nn(Xx,px)).reshape(-1),[0,1,1,0]),\n      \"XOR must be solved exactly\")\n\n# 6 \u2014 metrics\nyt=np.array([0,0,0,0,1,1,1,1]); yp=np.array([0,0,1,1,0,1,1,1])\ncheck(abs(precision(yt,yp)-0.6)<1e-9, \"precision = 3/5\")\ncheck(abs(recall(yt,yp)-0.75)<1e-9, \"recall = 3/4\")\ncheck(abs(precision(np.array([0,0]),np.array([0,0])))<1e-12,\n      \"precision must return 0.0, not nan, when nothing is predicted positive\")","hints":["There are no hints for a gate. That is the point.","If you are stuck, write down what you DO remember and work forward from the loss.","Every gradient in this month reduced to input.T @ error. Start there."],"solution":"# Do not read this before attempting the gate.\nimport numpy as np\n\ndef fit_linear(x, y, lr=0.05, steps=3000):\n    w,b,L = 0.0,0.0,[]\n    for _ in range(steps):\n        e = (w*x+b)-y; L.append(float(np.mean(e**2)))\n        w -= lr*2*np.mean(e*x); b -= lr*2*np.mean(e)\n    return w,b,L\n\ndef sigmoid(z): return 1.0/(1.0+np.exp(-np.clip(z,-500,500)))\n\ndef fit_logistic(X, y, lr=0.1, steps=3000):\n    n,d = X.shape; W,b,L = np.zeros(d),0.0,[]\n    for _ in range(steps):\n        p = sigmoid(X@W+b); pc = np.clip(p,1e-12,1-1e-12)\n        L.append(float(-np.mean(y*np.log(pc)+(1-y)*np.log(1-pc))))\n        e = p-y; W -= lr*(X.T@e)/n; b -= lr*np.mean(e)\n    return W,b,L\n\ndef init_params(d,h,seed=0):\n    rng=np.random.default_rng(seed)\n    return {\"W1\":rng.normal(0,0.5,(d,h)),\"b1\":np.zeros(h),\n            \"W2\":rng.normal(0,0.5,(h,1)),\"b2\":np.zeros(1)}\n\ndef forward(X,p):\n    Z1=X@p[\"W1\"]+p[\"b1\"]; A1=np.tanh(Z1)\n    Z2=A1@p[\"W2\"]+p[\"b2\"]; A2=sigmoid(Z2)\n    return A2,{\"Z1\":Z1,\"A1\":A1,\"Z2\":Z2,\"A2\":A2}\n\ndef backward(X,y,p,cache):\n    n=X.shape[0]; A1,A2=cache[\"A1\"],cache[\"A2\"]\n    dZ2=A2-y\n    dW2=A1.T@dZ2/n; db2=np.mean(dZ2,axis=0)\n    dZ1=(dZ2@p[\"W2\"].T)*(1-A1**2)\n    dW1=X.T@dZ1/n; db1=np.mean(dZ1,axis=0)\n    return {\"dW1\":dW1,\"db1\":db1,\"dW2\":dW2,\"db2\":db2}\n\ndef train_nn(X,y,h=4,steps=6000,lr=0.5,seed=0):\n    p=init_params(X.shape[1],h,seed); L=[]\n    for _ in range(steps):\n        A2,c=forward(X,p); a=np.clip(A2,1e-12,1-1e-12)\n        L.append(float(-np.mean(y*np.log(a)+(1-y)*np.log(1-a))))\n        g=backward(X,y,p,c)\n        for k in (\"W1\",\"b1\",\"W2\",\"b2\"): p[k]=p[k]-lr*g[\"d\"+k]\n    return p,L\n\ndef predict_nn(X,p): return (forward(X,p)[0]>=0.5).astype(int)\n\ndef precision(y_true,y_pred):\n    yt,yp=np.asarray(y_true),np.asarray(y_pred)\n    tp=int(((yt==1)&(yp==1)).sum()); fp=int(((yt==0)&(yp==1)).sum())\n    return float(tp/(tp+fp)) if (tp+fp) else 0.0\n\ndef recall(y_true,y_pred):\n    yt,yp=np.asarray(y_true),np.asarray(y_pred)\n    tp=int(((yt==1)&(yp==1)).sum()); fn=int(((yt==1)&(yp==0)).sum())\n    return float(tp/(tp+fn)) if (tp+fn) else 0.0"}};

const days = DATA.days;

function todayIdx(){
  const t = new Date(); t.setHours(0,0,0,0);
  const iso = t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
  const i = days.findIndex(d => d.date === iso);
  if (i >= 0) return i;
  return iso < days[0].date ? 0 : days.length - 1;
}

const fmtDate = iso => {
  const [y,m,dd] = iso.split('-').map(Number);
  return new Date(y, m-1, dd).toLocaleDateString(undefined,
    {weekday:'long', day:'numeric', month:'long'});
};
const isDone = id => !!state.done[id];

function dayDone(d){ return d.tasks.every(t => isDone(t.id)); }

function streak(){
  let s = 0;
  for (let i = Math.min(idx, days.length-1); i >= 0; i--){
    if (days[i].date > days[todayIdx()].date) continue;
    if (dayDone(days[i])) s++; else break;
  }
  return s;
}

function render(){
  const d = days[idx];
  const ph = DATA.phases.find(p => p.n === d.phase);

  document.getElementById('pdot').style.background = d.phaseColor;
  document.getElementById('sday').textContent = `Day ${idx+1} · Week ${d.week}`;
  document.getElementById('ssub').textContent = `Phase ${d.phase} — ${d.phaseName}`;
  document.getElementById('streak').textContent = streak() + 'd';

  const allTasks = days.flatMap(x => x.tasks);
  const doneAll = allTasks.filter(t => isDone(t.id)).length;
  document.getElementById('obar').style.width = (100*doneAll/allTasks.length) + '%';

  document.getElementById('eyebrow').textContent = fmtDate(d.date);
  document.getElementById('theme').textContent = d.theme;
  const mins = d.tasks.filter(t=>t.cat!=='audio').reduce((a,t)=>a+t.mins,0);
  const audio = d.tasks.filter(t=>t.cat==='audio').reduce((a,t)=>a+t.mins,0);
  document.getElementById('daymeta').textContent =
    `${(mins/60).toFixed(1)} h focused` + (audio ? ` · ${(audio/60).toFixed(1)} h audio while driving` : '');

  document.getElementById('gate').innerHTML = d.isGate
    ? `<div class="gatebanner"><b>ASSESSMENT DAY</b><span>No references, no help. This measures what actually stuck — a bad result is information, not failure.</span></div>` : '';

  const blocks = {};
  d.tasks.forEach(t => { (blocks[t.block] = blocks[t.block] || []).push(t); });
  document.getElementById('blocks').innerHTML = Object.entries(blocks).map(([name, ts]) => `
    <section class="block">
      <div class="block-h"><h2>${name}</h2><span class="mins">${
        (ts.reduce((a,t)=>a+t.mins,0)/60).toFixed(1)} h</span></div>
      ${ts.map(t => `
        <div class="task ${isDone(t.id)?'done':''}" data-id="${t.id}">
          <div class="task-row">
            <button class="check" data-check="${t.id}" aria-label="Toggle done">
              <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5"
                stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
            </button>
            <div class="task-main">
              <div class="task-title">${t.title}</div>
              <div class="task-tags">
                <span class="chip cat-${t.cat}">${t.cat}</span>
                <span class="chip">${t.mins} min</span>
              </div>
            </div>
            <span class="expand">▾</span>
          </div>
          <div class="detail">${t.detail}
            ${EX[t.id] ? `<div><button class="exbtn ${state.passed[t.id]?'passed':''}"
                data-ex="${t.id}">${state.passed[t.id]
                ? '✓ Tests passing — reopen' : '⌨ Open the exercise'}</button></div>
              ${state.passed[t.id] ? '' :
                '<div class="lockmsg">This task has a coding exercise with tests. '
                + 'The box ticks itself when they pass.</div>'}` : ''}
            ${t.cat === 'audio' ? '' : `<div><button class="timer-btn" data-timer="${
              Math.min(t.mins, 25)}" data-title="${t.title.replace(/"/g,'&quot;')}">▶ Start ${
              Math.min(t.mins, 25)}-min focus block</button></div>`}
          </div>
        </div>`).join('')}
    </section>`).join('');

  document.getElementById('complete').innerHTML = dayDone(d)
    ? `<div class="complete"><b>Day complete</b><span>${(mins/60).toFixed(1)} hours logged. Rest — tomorrow is Day ${idx+2}.</span></div>` : '';

  document.getElementById('stDone').textContent = doneAll;
  document.getElementById('stHours').textContent = Math.round(
    allTasks.filter(t=>isDone(t.id)).reduce((a,t)=>a+t.mins,0)/60);
  document.getElementById('stDay').textContent = `${idx+1}/${days.length}`;

  document.getElementById('phases').innerHTML = DATA.phases.map(p => {
    const ts = days.filter(x=>x.phase===p.n).flatMap(x=>x.tasks);
    const dn = ts.filter(t=>isDone(t.id)).length;
    const pct = Math.round(100*dn/ts.length);
    return `<div class="ph">
      <span class="phase-dot" style="background:${p.color}"></span>
      <span class="ph-name">${p.name}</span>
      <span class="ph-bar"><span style="width:${pct}%;background:${p.color}"></span></span>
      <span class="ph-pct mono">${pct}%</span></div>`;
  }).join('');

  document.getElementById('prev').disabled = idx === 0;
  document.getElementById('next').disabled = idx === days.length - 1;
  state.idx = idx; save();
}

document.addEventListener('click', e => {
  const c = e.target.closest('[data-check]');
  if (c){ const id = c.dataset.check;
    if (state.done[id]) { delete state.done[id]; delete state.unverified[id]; }
    else {
      // A task with an exercise is not "done" on your say-so. Tests decide.
      if (EX[id] && !state.passed[id]) {
        if (!confirm('This task has tests and they have not passed yet.\n\n'
            + 'Open the exercise instead?\n\nCancel = mark it done anyway '
            + '(it will be flagged as unverified).')) {
          state.done[id] = Date.now(); state.unverified[id] = true;
        } else { openEx(id); return; }
      } else state.done[id] = Date.now();
    }
    save(); render(); return; }
  const xb = e.target.closest('[data-ex]');
  if (xb){ openEx(xb.dataset.ex); return; }
  const tb = e.target.closest('[data-timer]');
  if (tb){ startTimer(+tb.dataset.timer, tb.dataset.title); return; }
  const t = e.target.closest('.task');
  if (t && !e.target.closest('.timer-btn')) t.classList.toggle('open');
});

document.getElementById('prev').onclick = () => { if(idx>0){idx--;render();window.scrollTo(0,0);} };
document.getElementById('next').onclick = () => { if(idx<days.length-1){idx++;render();window.scrollTo(0,0);} };
document.getElementById('todayBtn').onclick = () => { idx = todayIdx(); render(); window.scrollTo(0,0); };

/* theme */
const themeBtn = document.getElementById('themeBtn');
themeBtn.onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : cur === 'light' ? '' : 'dark';
  if (next) document.documentElement.setAttribute('data-theme', next);
  else document.documentElement.removeAttribute('data-theme');
  state.theme = next; save();
};
if (state.theme) document.documentElement.setAttribute('data-theme', state.theme);

/* timer */
let tInt = null, tLeft = 0, tPaused = false;
function startTimer(mins, title){
  tLeft = mins*60; tPaused = false;
  document.getElementById('tTask').textContent = title;
  document.getElementById('timer').classList.add('on');
  document.getElementById('tPause').textContent = 'Pause';
  tick(); clearInterval(tInt);
  tInt = setInterval(() => { if(!tPaused){ tLeft--; tick();
    if (tLeft <= 0){ clearInterval(tInt); document.getElementById('tTime').textContent = 'DONE'; } } }, 1000);
}
function tick(){
  const m = Math.floor(Math.max(tLeft,0)/60), s = Math.max(tLeft,0)%60;
  document.getElementById('tTime').textContent =
    String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
document.getElementById('tPause').onclick = () => {
  tPaused = !tPaused;
  document.getElementById('tPause').textContent = tPaused ? 'Resume' : 'Pause';
};
document.getElementById('tStop').onclick = () => {
  clearInterval(tInt); document.getElementById('timer').classList.remove('on');
};

/* ---------------------------------------------------------------- exercises */
let curEx = null, pyodide = null, pyLoading = null;

function md(src){
  const blocks = [];
  // pull fenced code out first so paragraph joining cannot touch it
  let s = src.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
             .replace(/```\n?([\s\S]*?)```/g, (m,c) => {
               blocks.push(`<pre><code>${c.replace(/\n+$/,'')}</code></pre>`);
               return `␀${blocks.length-1}␀`;
             });
  const html = s.split(/\n{2,}/).map(para => {
    const t = para.trim();
    if (!t) return '';
    if (/^␀\d+␀$/.test(t)) return t;              // a code block
    if (t.startsWith('## ')) return `<h2>${inline(t.slice(3))}</h2>`;
    // join wrapped lines into one paragraph, keep list items on their own line
    if (/^[-*\d]/.test(t) && t.includes('\n'))
      return `<p>${t.split('\n').map(l=>inline(l.trim())).join('<br>')}</p>`;
    return `<p>${inline(t.replace(/\n/g,' '))}</p>`;
  }).join('');
  return html.replace(/␀(\d+)␀/g, (m,i) => blocks[+i]);
}
function inline(t){
  return t.replace(/`([^`]+)`/g,'<code>$1</code>')
          .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
          .replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g,'<em>$1</em>');
}

function openEx(id){
  const e = EX[id]; if (!e) return;
  curEx = id;
  document.getElementById('exTitle').textContent = e.title;
  document.getElementById('paneBrief').innerHTML = `<div class="brief">${md(e.brief)}</div>`;
  document.getElementById('code').value = state.code[id] || e.starter;
  document.getElementById('results').innerHTML = '';
  document.getElementById('paneHints').innerHTML = e.hints.map((h,i)=>
    `<div class="hint"><b>HINT ${i+1}</b>${md(h).replace(/<\/?p>/g,'')}</div>`).join('');
  document.getElementById('paneSol').innerHTML =
    `<div class="solwarn"><strong>Try it properly first.</strong> Reading the solution
     before you have struggled is the fastest way to feel like you learned something
     and retain nothing. Use the hints. Come back tomorrow if you must.</div>
     <div class="brief"><pre><code>${e.solution
       .replace(/&/g,'&amp;').replace(/</g,'&lt;')}</code></pre></div>`;
  showPane('brief');
  document.getElementById('ex').classList.add('on');
}
function showPane(name){
  document.querySelectorAll('.ex-tabs button').forEach(b =>
    b.classList.toggle('sel', b.dataset.pane === name));
  const map = {brief:'paneBrief', code:'paneCode', hints:'paneHints', sol:'paneSol'};
  Object.entries(map).forEach(([k,v]) =>
    document.getElementById(v).classList.toggle('sel', k === name));
  document.querySelector('.ex-body').scrollTop = 0;
}
document.querySelectorAll('.ex-tabs button').forEach(b =>
  b.onclick = () => showPane(b.dataset.pane));
document.getElementById('exClose').onclick = () => {
  if (curEx) { state.code[curEx] = document.getElementById('code').value; save(); }
  document.getElementById('ex').classList.remove('on'); curEx = null; render();
};
document.getElementById('resetBtn2').onclick = () => {
  if (curEx && confirm('Replace your code with the starter template?'))
    document.getElementById('code').value = EX[curEx].starter;
};
document.getElementById('code').addEventListener('keydown', ev => {
  if (ev.key === 'Tab'){ ev.preventDefault();
    const t = ev.target, s = t.selectionStart;
    t.value = t.value.slice(0,s) + '    ' + t.value.slice(t.selectionEnd);
    t.selectionStart = t.selectionEnd = s + 4; }
});

async function getPy(){
  if (pyodide) return pyodide;
  if (pyLoading) return pyLoading;
  const st = document.getElementById('pyStatus');
  pyLoading = (async () => {
    st.textContent = 'Loading Python (first run only, ~15s)…';
    if (!window.loadPyodide){
      await new Promise((res, rej) => {
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js';
        s.onload = res; s.onerror = () => rej(new Error('could not load Python'));
        document.head.appendChild(s);
      });
    }
    const py = await loadPyodide({indexURL:'https://cdn.jsdelivr.net/pyodide/v0.26.2/full/'});
    st.textContent = 'Loading numpy…';
    await py.loadPackage('numpy');
    st.textContent = '';
    pyodide = py; return py;
  })();
  return pyLoading;
}

document.getElementById('runBtn').onclick = async () => {
  if (!curEx) return;
  const btn = document.getElementById('runBtn');
  const out = document.getElementById('results');
  const st  = document.getElementById('pyStatus');
  const src = document.getElementById('code').value;
  state.code[curEx] = src; save();
  btn.disabled = true; out.innerHTML = '';
  let py;
  try { py = await getPy(); }
  catch(err){
    btn.disabled = false; st.textContent = '';
    out.innerHTML = `<div class="res fail"><span class="ic">!</span><span class="msg">
      Could not load Python — you need to be online the first time. Run your code in
      VS Code instead; the tests are in the Problem tab.</span></div>`;
    return;
  }
  st.textContent = 'Running…';
  py.globals.set('_student_src', src);
  py.globals.set('_test_src', EX[curEx].tests);
  let report;
  try {
    report = py.runPython(`
import json, traceback
_res = []
def check(cond, msg=""):
    _res.append({"ok": bool(cond), "msg": msg})
_ns = {"check": check}
_err = None
try:
    exec(_student_src, _ns)
except Exception:
    _err = "Your code raised before tests ran:\\n" + traceback.format_exc()
if _err is None:
    try:
        exec(_test_src, _ns)
    except Exception:
        _err = "A test raised:\\n" + traceback.format_exc()
json.dumps({"results": _res, "error": _err})
`);
  } catch(err){ report = JSON.stringify({results:[], error:String(err)}); }
  st.textContent = '';
  btn.disabled = false;

  const {results, error} = JSON.parse(report);
  let html = results.map((r,i) => `<div class="res ${r.ok?'pass':'fail'}">
      <span class="ic">${r.ok?'✓':'✕'}</span>
      <span class="msg">${r.ok ? 'Check '+(i+1)+' passed'
        : (r.msg || 'Check '+(i+1)+' failed').replace(/</g,'&lt;')}</span></div>`).join('');
  if (error) html += `<div class="res fail"><span class="ic">!</span>
      <span class="msg"><pre style="white-space:pre-wrap;margin:0">${
      error.replace(/</g,'&lt;')}</pre></span></div>`;

  const passed = !error && results.length > 0 && results.every(r => r.ok);
  if (passed){
    html += `<div class="allpass">All ${results.length} checks passed — task complete</div>`;
    state.passed[curEx] = true;
    state.done[curEx] = Date.now();
    delete state.unverified[curEx];
    save();
  }
  out.innerHTML = html;
};

/* export / import / reset */
document.getElementById('exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify(state)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'bootcamp-progress.json'; a.click();
};
document.getElementById('importBtn').onclick = () => {
  const i = document.createElement('input'); i.type = 'file'; i.accept = '.json';
  i.onchange = () => { const f = i.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => { try { state = JSON.parse(r.result); save(); idx = todayIdx(); render(); }
      catch(err){ alert('Could not read that file.'); } };
    r.readAsText(f); };
  i.click();
};
document.getElementById('resetBtn').onclick = () => {
  if (confirm('Clear all progress? This cannot be undone.')){
    state = {done:{}, idx:null}; save(); idx = todayIdx(); render(); }
};

render();
</script>
