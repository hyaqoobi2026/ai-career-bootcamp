<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Career Bootcamp</title>
<style>
:root{
  --paper:#f6f7f9; --panel:#ffffff; --ink:#0f1720; --body:#3d4756; --muted:#7a8494;
  --line:#e3e7ed; --line-soft:#eef1f5;
  --primary:#2f6fe0; --primary-soft:#e8f0fd;
  --done:#1f9d5f; --done-soft:#e6f6ee;
  --gate:#b57614; --gate-soft:#fdf3e0;
  --shadow:0 1px 2px rgba(15,23,32,.05), 0 4px 14px rgba(15,23,32,.05);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#0b1119;--panel:#151d29;--ink:#eef2f8;--body:#c2ccd9;--muted:#7e8b9c;
    --line:#243040;--line-soft:#1c2634;--primary:#5b9bff;--primary-soft:#16263f;
    --done:#35c281;--done-soft:#102a1e;--gate:#e3a944;--gate-soft:#2c2314;--shadow:none;}
}
:root[data-theme="dark"]{--paper:#0b1119;--panel:#151d29;--ink:#eef2f8;--body:#c2ccd9;--muted:#7e8b9c;
  --line:#243040;--line-soft:#1c2634;--primary:#5b9bff;--primary-soft:#16263f;
  --done:#35c281;--done-soft:#102a1e;--gate:#e3a944;--gate-soft:#2c2314;--shadow:none;}
:root[data-theme="light"]{--paper:#f6f7f9;--panel:#ffffff;--ink:#0f1720;--body:#3d4756;--muted:#7a8494;
  --line:#e3e7ed;--line-soft:#eef1f5;--primary:#2f6fe0;--primary-soft:#e8f0fd;
  --done:#1f9d5f;--done-soft:#e6f6ee;--gate:#b57614;--gate-soft:#fdf3e0;
  --shadow:0 1px 2px rgba(15,23,32,.05), 0 4px 14px rgba(15,23,32,.05);}

:root{color-scheme:light dark}
:root[data-theme="dark"]{color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--paper);color:var(--body);font-family:var(--sans);
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:96px}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
h1,h2,h3{margin:0;color:var(--ink);line-height:1.25}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---- status bar ---- */
.status{position:sticky;top:0;z-index:20;background:var(--paper);
  border-bottom:1px solid var(--line);padding:10px 0 9px}
.status-in{display:flex;align-items:center;gap:10px}
.phase-dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.status-main{flex:1;min-width:0}
.status-day{font-size:15px;font-weight:650;color:var(--ink);letter-spacing:-.01em}
.status-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.streak{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--gate);
  background:var(--gate-soft);padding:4px 9px;border-radius:999px;white-space:nowrap}
.theme-btn{font-size:16px;padding:4px 6px;opacity:.55}
.bar{height:4px;background:var(--line-soft);border-radius:999px;margin-top:9px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--primary);border-radius:999px;transition:width .4s}

/* ---- day head ---- */
.dayhead{padding:20px 0 6px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);font-weight:600}
.theme-title{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:5px 0 4px;text-wrap:balance}
.daymeta{font-size:13px;color:var(--muted)}
.gatebanner{background:var(--gate-soft);border:1px solid var(--gate);border-radius:var(--r);
  padding:12px 14px;margin-top:14px}
.gatebanner b{color:var(--gate);display:block;font-size:13px;letter-spacing:.02em}
.gatebanner span{font-size:13px;color:var(--body)}

/* ---- blocks + tasks ---- */
.block{margin-top:22px}
.block-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  padding:0 2px 8px}
.block-h h2{font-size:12px;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);font-weight:600}
.block-h .mins{font-family:var(--mono);font-size:12px;color:var(--muted)}
.task{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  margin-bottom:9px;box-shadow:var(--shadow);overflow:hidden;transition:border-color .2s}
.task.done{background:var(--done-soft);border-color:transparent}
.task-row{display:flex;gap:12px;padding:14px;align-items:flex-start}
.check{width:24px;height:24px;flex:0 0 auto;border:2px solid var(--line);border-radius:8px;
  margin-top:1px;display:grid;place-items:center;transition:all .18s;background:var(--panel)}
.check svg{width:14px;height:14px;opacity:0;transform:scale(.6);transition:all .18s}
.task.done .check{background:var(--done);border-color:var(--done)}
.task.done .check svg{opacity:1;transform:scale(1)}
.task-main{flex:1;min-width:0}
.task-title{font-weight:600;color:var(--ink);font-size:15.5px;line-height:1.35}
.task.done .task-title{opacity:.55;text-decoration:line-through}
.task-tags{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;
  background:var(--line-soft);color:var(--muted);letter-spacing:.02em}
.chip.cat-implementation{background:var(--primary-soft);color:var(--primary)}
.chip.cat-math{background:#f0e9fb;color:#7043c9}
.chip.cat-project{background:#fdeaf0;color:#c2306a}
.chip.cat-course{background:#e6f5f2;color:#12806c}
.chip.cat-reading{background:#fdf1e3;color:#a86a1d}
.chip.cat-job{background:var(--gate-soft);color:var(--gate)}
.chip.cat-review{background:var(--line-soft);color:var(--muted)}
.chip.cat-audio{background:#eae9fb;color:#5344c9}
@media (prefers-color-scheme:dark){ .chip.cat-audio{background:#1c1a3a;color:#9d93f0} }
@media (prefers-color-scheme:dark){
  .chip.cat-math{background:#241a3a;color:#b393f0}
  .chip.cat-project{background:#3a1626;color:#f090b4}
  .chip.cat-course{background:#0f2b26;color:#4fd0b4}
  .chip.cat-reading{background:#2e2211;color:#e0a95c}
}
.expand{margin-left:auto;padding:2px 4px;color:var(--muted);font-size:13px;opacity:.7}
.detail{padding:0 14px 14px 50px;font-size:14px;color:var(--body);display:none;line-height:1.55}
.task.open .detail{display:block}
.timer-btn{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:7px 12px;
  border:1px solid var(--line);border-radius:9px;font-size:13px;font-weight:600;color:var(--primary);
  background:var(--panel)}

/* ---- day complete ---- */
.complete{margin-top:22px;background:var(--done-soft);border:1px solid var(--done);
  border-radius:var(--r);padding:18px;text-align:center}
.complete b{display:block;color:var(--done);font-size:17px;margin-bottom:3px}
.complete span{font-size:13px;color:var(--body)}

/* ---- stats ---- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:24px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat .k{font-size:11px;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-size:21px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;margin-top:3px}

/* ---- phases ---- */
.phases{margin-top:24px}
.ph{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line-soft)}
.ph-name{flex:1;font-size:14px;color:var(--ink);font-weight:600}
.ph-bar{width:84px;height:5px;background:var(--line-soft);border-radius:999px;overflow:hidden}
.ph-bar span{display:block;height:100%;border-radius:999px}
.ph-pct{font-family:var(--mono);font-size:12px;color:var(--muted);width:34px;text-align:right}

/* ---- nav ---- */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);
  padding:9px 14px calc(9px + env(safe-area-inset-bottom));z-index:30}
.nav-in{max-width:680px;margin:0 auto;display:flex;gap:9px;align-items:center}
.nav button{flex:0 0 auto;padding:11px 15px;border:1px solid var(--line);border-radius:11px;
  background:var(--paper);font-size:15px;font-weight:600;color:var(--ink)}
.nav .today{flex:1;background:var(--primary);color:#fff;border-color:transparent}
.nav button:disabled{opacity:.35}

/* ---- timer overlay ---- */
.timer{position:fixed;inset:0;background:rgba(10,15,22,.93);z-index:50;display:none;
  flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.timer.on{display:flex}
.timer-task{color:#9fb0c4;font-size:14px;max-width:30ch;margin-bottom:6px}
.timer-time{font-family:var(--mono);font-size:68px;font-weight:700;color:#fff;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.timer-acts{display:flex;gap:10px;margin-top:22px}
.timer-acts button{padding:12px 22px;border-radius:11px;font-weight:600;font-size:15px;
  background:#1d2a3a;color:#fff;border:1px solid #2e3d50}
.timer-acts .stop{background:#fff;color:#0f1720;border-color:#fff}

/* ---- exercise ---- */
.exbtn{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:8px 13px;
  border-radius:9px;font-size:13px;font-weight:650;background:var(--primary);color:#fff}
.exbtn.passed{background:var(--done)}
.lockmsg{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}
.ex{position:fixed;inset:0;background:var(--paper);z-index:60;display:none;
  flex-direction:column;overflow:hidden}
.ex.on{display:flex}
.ex-top{display:flex;align-items:center;gap:10px;padding:12px 14px;
  border-bottom:1px solid var(--line);background:var(--panel);flex:0 0 auto}
.ex-top h3{flex:1;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex-top button{padding:7px 12px;border:1px solid var(--line);border-radius:8px;
  font-size:13px;font-weight:600;background:var(--paper);color:var(--ink)}
.ex-tabs{display:flex;gap:4px;padding:8px 14px 0;background:var(--panel);flex:0 0 auto}
.ex-tabs button{padding:7px 13px;border-radius:8px 8px 0 0;font-size:13px;font-weight:600;
  color:var(--muted)}
.ex-tabs button.sel{background:var(--paper);color:var(--ink)}
.ex-body{flex:1;overflow-y:auto;padding:16px 14px 20px;-webkit-overflow-scrolling:touch}
.pane{display:none;max-width:760px;margin:0 auto}
.pane.sel{display:block}
.brief h2{font-size:17px;margin:20px 0 8px}
.brief p{margin:10px 0}
.brief code{font-family:var(--mono);font-size:.88em;background:var(--line-soft);
  padding:1px 5px;border-radius:4px}
.brief pre{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:12px;overflow-x:auto;font-family:var(--mono);font-size:12.5px;line-height:1.55}
.brief pre code{background:none;padding:0}
.brief strong{color:var(--ink)}
#code{width:100%;min-height:340px;font-family:var(--mono);font-size:13px;line-height:1.5;
  padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);
  color:var(--ink);resize:vertical;tab-size:4;white-space:pre;overflow-wrap:normal;
  overflow-x:auto}
.runbar{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.runbar button{padding:10px 16px;border-radius:9px;font-size:14px;font-weight:650;
  background:var(--primary);color:#fff}
.runbar button.ghost{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.runbar button:disabled{opacity:.5}
.status{font-size:12.5px;color:var(--muted)}
#results{margin-top:14px}
.res{display:flex;gap:9px;padding:9px 11px;border-radius:8px;margin-bottom:6px;
  font-size:13px;line-height:1.45;align-items:flex-start}
.res.pass{background:var(--done-soft);color:var(--done)}
.res.fail{background:#fdecec;color:#c0392b}
@media (prefers-color-scheme:dark){.res.fail{background:#3a1a1a;color:#ff8a80}}
.res .ic{font-weight:700;flex:0 0 auto}
.res .msg{color:var(--body)}
.res.pass .msg{color:var(--done)}
.allpass{background:var(--done);color:#fff;padding:14px;border-radius:10px;
  font-weight:650;text-align:center;margin-top:12px}
.hint{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--gate);
  border-radius:8px;padding:11px 13px;margin-bottom:8px;font-size:13.5px;line-height:1.55}
.hint b{color:var(--gate);display:block;font-size:11px;letter-spacing:.08em;margin-bottom:3px}
.solwarn{background:var(--gate-soft);border:1px solid var(--gate);border-radius:10px;
  padding:14px;margin-bottom:12px;font-size:13.5px;line-height:1.55}
.foot{margin:28px 0 10px;font-size:12px;color:var(--muted);text-align:center;line-height:1.7}
.foot button{text-decoration:underline;color:var(--muted);font-size:12px}
@media(min-width:700px){ .theme-title{font-size:28px} body{font-size:16.5px} }
</style>

<div class="status">
  <div class="wrap status-in">
    <span class="phase-dot" id="pdot"></span>
    <div class="status-main">
      <div class="status-day" id="sday">—</div>
      <div class="status-sub" id="ssub">—</div>
    </div>
    <span class="streak mono" id="streak">0d</span>
    <button class="theme-btn" id="themeBtn" title="Theme">◐</button>
  </div>
  <div class="wrap"><div class="bar"><span id="obar" style="width:0%"></span></div></div>
</div>

<main class="wrap">
  <div class="dayhead">
    <div class="eyebrow" id="eyebrow">—</div>
    <h1 class="theme-title" id="theme">—</h1>
    <div class="daymeta" id="daymeta">—</div>
    <div id="gate"></div>
  </div>

  <div id="blocks"></div>
  <div id="complete"></div>

  <div class="stats">
    <div class="stat"><div class="k">Done</div><div class="v mono" id="stDone">0</div></div>
    <div class="stat"><div class="k">Hours</div><div class="v mono" id="stHours">0</div></div>
    <div class="stat"><div class="k">Day</div><div class="v mono" id="stDay">0</div></div>
  </div>

  <div class="phases" id="phases"></div>

  <div class="foot">
    Tap a task to see what to do. Check it off when it's finished.<br>
    Progress saves on this device.
    <button id="exportBtn">Export</button> ·
    <button id="importBtn">Import</button> ·
    <button id="resetBtn">Reset</button>
  </div>
</main>

<div class="nav"><div class="nav-in">
  <button id="prev">‹</button>
  <button class="today" id="todayBtn">Today</button>
  <button id="next">›</button>
</div></div>

<div class="ex" id="ex">
  <div class="ex-top">
    <h3 id="exTitle">—</h3>
    <button id="exClose">Close</button>
  </div>
  <div class="ex-tabs">
    <button data-pane="brief" class="sel">Problem</button>
    <button data-pane="code">Code</button>
    <button data-pane="hints">Hints</button>
    <button data-pane="sol">Solution</button>
  </div>
  <div class="ex-body">
    <div class="pane brief sel" id="paneBrief"></div>

    <div class="pane" id="paneCode">
      <textarea id="code" spellcheck="false" autocapitalize="off" autocorrect="off"></textarea>
      <div class="runbar">
        <button id="runBtn">Run tests</button>
        <button id="resetBtn2" class="ghost">Reset code</button>
        <span class="status" id="pyStatus"></span>
      </div>
      <div id="results"></div>
    </div>

    <div class="pane" id="paneHints"></div>
    <div class="pane" id="paneSol"></div>
  </div>
</div>

<div class="timer" id="timer">
  <div class="timer-task" id="tTask">—</div>
  <div class="timer-time mono" id="tTime">00:00</div>
  <div class="timer-acts">
    <button id="tPause">Pause</button>
    <button class="stop" id="tStop">Done</button>
  </div>
</div>

const EX = {"d1-deep":{"title":"Linear regression from scratch","brief":"## What you are building\n\nA function that learns the line `y = wx + b` from data, using nothing but numpy\nand gradient descent you wrote yourself. No scikit-learn.\n\n## Do this on paper FIRST\n\nYou cannot skip this part. The loss is mean squared error:\n\n```\nL = (1/n) \u00b7 \u03a3 (\u0177\u1d62 \u2212 y\u1d62)\u00b2        where  \u0177\u1d62 = w\u00b7x\u1d62 + b\n```\n\nWork out `\u2202L/\u2202w` and `\u2202L/\u2202b` by hand before writing any code. Use the chain\nrule. If you cannot derive them, you do not yet understand what gradient descent\nis doing, and typing the answer will not fix that.\n\nWhen you have them, they should look like:\n\n```\n\u2202L/\u2202w = (2/n) \u00b7 \u03a3 (\u0177\u1d62 \u2212 y\u1d62) \u00b7 x\u1d62\n\u2202L/\u2202b = (2/n) \u00b7 \u03a3 (\u0177\u1d62 \u2212 y\u1d62)\n```\n\n## The update rule\n\nEach step, move each parameter a small distance *against* its gradient:\n\n```\nw \u2190 w \u2212 lr \u00b7 \u2202L/\u2202w\nb \u2190 b \u2212 lr \u00b7 \u2202L/\u2202b\n```\n\n## Your task\n\nImplement `fit_linear(x, y, lr=0.01, steps=2000)`.\n\nReturn `(w, b, losses)` where `losses` is a list containing the loss **before\neach update** \u2014 so `len(losses) == steps`.\n\n## Success\n\nOn data generated from `y = 3x + 2 + noise`, you should recover `w \u2248 3` and\n`b \u2248 2`, and the loss should fall steadily.","starter":"import numpy as np\n\ndef fit_linear(x, y, lr=0.01, steps=2000):\n    \"\"\"Fit y = w*x + b by gradient descent.\n\n    x, y : 1-D numpy arrays of the same length\n    returns (w, b, losses)\n    \"\"\"\n    w = 0.0\n    b = 0.0\n    losses = []\n\n    for _ in range(steps):\n        # 1. predict\n        # 2. compute loss, append to losses\n        # 3. compute gradients dw, db\n        # 4. update w and b\n        pass\n\n    return w, b, losses","tests":"import numpy as np\nrng = np.random.default_rng(0)\nx = rng.uniform(-3, 3, 200)\ny = 3.0 * x + 2.0 + rng.normal(0, 0.1, 200)\n\nw, b, losses = fit_linear(x, y, lr=0.05, steps=3000)\n\ncheck(len(losses) == 3000, f\"losses should have one entry per step (got {len(losses)})\")\ncheck(abs(w - 3.0) < 0.1, f\"w should be about 3.0, got {w:.4f}\")\ncheck(abs(b - 2.0) < 0.1, f\"b should be about 2.0, got {b:.4f}\")\ncheck(losses[-1] < losses[0], \"loss should decrease overall\")\ncheck(losses[-1] < 0.05, f\"final loss should be small, got {losses[-1]:.4f}\")\ncheck(all(losses[i+1] <= losses[i] + 1e-6 for i in range(0, 200)),\n      \"loss should fall monotonically early on \u2014 if it spikes, your lr is too high \"\n      \"or a gradient sign is flipped\")\n\n# must generalise, not memorise\nxt = np.array([-5.0, 0.0, 5.0])\npred = w * xt + b\nexpect = 3.0 * xt + 2.0\ncheck(np.allclose(pred, expect, atol=0.3), \"predictions should match the true line\")","hints":["Prediction for the whole array at once: `yhat = w * x + b`. No Python loop over samples.","Loss: `np.mean((yhat - y) ** 2)`.","The error term `(yhat - y)` appears in both gradients. Compute it once.","`dw = 2 * np.mean((yhat - y) * x)` and `db = 2 * np.mean(yhat - y)`.","Append the loss BEFORE updating w and b, or you will have steps+1 entries.","If the loss explodes to nan, your learning rate is too large. Try 0.01."],"solution":"import numpy as np\n\ndef fit_linear(x, y, lr=0.01, steps=2000):\n    w, b = 0.0, 0.0\n    losses = []\n    n = len(x)\n    for _ in range(steps):\n        yhat = w * x + b\n        err = yhat - y\n        losses.append(float(np.mean(err ** 2)))\n        dw = 2.0 * np.mean(err * x)\n        db = 2.0 * np.mean(err)\n        w -= lr * dw\n        b -= lr * db\n    return w, b, losses"},"d2-deep":{"title":"Linear regression, multivariate","brief":"## What changes\n\nOne feature becomes many. Instead of a scalar `w` you now have a weight\n**vector** `W` with one entry per feature.\n\n```\n\u0177 = X @ W + b\n```\n\n`X` has shape `(n, d)` \u2014 n samples, d features. `W` has shape `(d,)`. The `@`\noperator is matrix multiplication, and it produces `(n,)` predictions.\n\n## The gradients, in matrix form\n\nSame chain rule, written for vectors:\n\n```\n\u2202L/\u2202W = (2/n) \u00b7 X\u1d40 @ (\u0177 \u2212 y)      shape (d,)\n\u2202L/\u2202b = (2/n) \u00b7 \u03a3 (\u0177 \u2212 y)          scalar\n```\n\n**Understand why `X\u1d40` appears.** Each weight `W\u2c7c` affects the prediction through\ncolumn j of X, so its gradient is the error dotted with that column.\nTransposing and multiplying does all d of those dot products at once.\n\n## Shapes are the whole game\n\nPrint `.shape` obsessively. Most bugs in this exercise are shape bugs, and the\nerror messages are unhelpful. `X.T @ err` is `(d,n) @ (n,) \u2192 (d,)`. If you get\n`(n,)` or a scalar, something is transposed wrong.\n\n## Your task\n\nImplement `fit_linear_multi(X, y, lr=0.01, steps=2000)` returning `(W, b, losses)`.\n\n**No Python loop over samples or features.** One matrix operation per step.","starter":"import numpy as np\n\ndef fit_linear_multi(X, y, lr=0.01, steps=2000):\n    \"\"\"Fit y = X @ W + b by gradient descent.\n\n    X : (n, d) numpy array\n    y : (n,)  numpy array\n    returns (W, b, losses)   W has shape (d,)\n    \"\"\"\n    n, d = X.shape\n    W = np.zeros(d)\n    b = 0.0\n    losses = []\n\n    for _ in range(steps):\n        # predict -> loss -> gradients -> update\n        pass\n\n    return W, b, losses","tests":"import numpy as np\nrng = np.random.default_rng(1)\nn, d = 400, 3\nX = rng.normal(0, 1, (n, d))\nW_true = np.array([2.0, -1.5, 0.5])\nb_true = 4.0\ny = X @ W_true + b_true + rng.normal(0, 0.05, n)\n\nW, b, losses = fit_linear_multi(X, y, lr=0.1, steps=3000)\nW = np.asarray(W)\n\ncheck(W.shape == (3,), f\"W should have shape (3,), got {W.shape}\")\ncheck(np.allclose(W, W_true, atol=0.05),\n      f\"W should be about {W_true}, got {np.round(W, 4)}\")\ncheck(abs(b - b_true) < 0.05, f\"b should be about {b_true}, got {b:.4f}\")\ncheck(len(losses) == 3000, f\"expected 3000 losses, got {len(losses)}\")\ncheck(losses[-1] < 0.01, f\"final loss should be small, got {losses[-1]:.5f}\")\n\n# a different number of features must work too\nX2 = rng.normal(0, 1, (200, 5))\nW2t = np.array([1.0, 0.0, -2.0, 3.0, 0.5])\ny2 = X2 @ W2t + 1.0\nW2, b2, _ = fit_linear_multi(X2, y2, lr=0.1, steps=4000)\ncheck(np.allclose(np.asarray(W2), W2t, atol=0.1),\n      \"your code should work for any number of features, not just 3\")","hints":["`yhat = X @ W + b` \u2014 broadcasting adds the scalar b to every prediction.","`err = yhat - y` has shape (n,).","`dW = 2 * (X.T @ err) / n` \u2014 check the shape is (d,).","`db = 2 * np.mean(err)`.","If W barely moves, your learning rate is too small for this scale. Try 0.1.","Do not use `np.dot` in a loop over columns. One `@` does all of it."],"solution":"import numpy as np\n\ndef fit_linear_multi(X, y, lr=0.01, steps=2000):\n    n, d = X.shape\n    W = np.zeros(d)\n    b = 0.0\n    losses = []\n    for _ in range(steps):\n        yhat = X @ W + b\n        err = yhat - y\n        losses.append(float(np.mean(err ** 2)))\n        W -= lr * (2.0 / n) * (X.T @ err)\n        b -= lr * 2.0 * np.mean(err)\n    return W, b, losses"},"d3-deep":{"title":"Logistic regression from scratch","brief":"## The change that matters\n\nLinear regression predicts a number. Now you predict a **probability**, so the\noutput must be squeezed into (0, 1). That is the sigmoid:\n\n```\n\u03c3(z) = 1 / (1 + e^(\u2212z))\n```\n\nYour model is `\u0177 = \u03c3(X @ W + b)`.\n\n## Why the loss changes\n\nSquared error is the wrong loss for probabilities \u2014 it is nearly flat when the\nmodel is confidently wrong, so gradients vanish exactly when you need them.\n\nUse **binary cross-entropy**:\n\n```\nL = \u2212(1/n) \u00b7 \u03a3 [ y\u1d62\u00b7log(\u0177\u1d62) + (1\u2212y\u1d62)\u00b7log(1\u2212\u0177\u1d62) ]\n```\n\nThis is Shannon's cross-entropy: how surprised your model was by the truth.\n\n## The result worth knowing\n\nDerive `\u2202L/\u2202W` and something remarkable happens \u2014 the sigmoid derivative and\nthe log cancel, and you get:\n\n```\n\u2202L/\u2202W = (1/n) \u00b7 X\u1d40 @ (\u0177 \u2212 y)\n\u2202L/\u2202b = (1/n) \u00b7 \u03a3 (\u0177 \u2212 y)\n```\n\n**Identical in form to linear regression.** Different model, different loss,\nsame gradient shape. That is not a coincidence and it is worth sitting with.\n\n## Watch out\n\n`log(0)` is `-inf`. Clip your predictions before taking logs.\n\n## Your task\n\nImplement `sigmoid(z)`, `fit_logistic(X, y, lr, steps)` returning\n`(W, b, losses)`, and `predict(X, W, b)` returning hard 0/1 labels.","starter":"import numpy as np\n\ndef sigmoid(z):\n    \"\"\"Elementwise 1 / (1 + exp(-z)). Must not overflow for large |z|.\"\"\"\n    pass\n\ndef fit_logistic(X, y, lr=0.1, steps=3000):\n    \"\"\"X:(n,d)  y:(n,) of 0/1  ->  (W, b, losses) with binary cross-entropy.\"\"\"\n    n, d = X.shape\n    W = np.zeros(d)\n    b = 0.0\n    losses = []\n    for _ in range(steps):\n        pass\n    return W, b, losses\n\ndef predict(X, W, b):\n    \"\"\"Return hard 0/1 labels \u2014 threshold the probability at 0.5.\"\"\"\n    pass","tests":"import numpy as np\n\n# --- sigmoid\ncheck(abs(sigmoid(np.array([0.0]))[0] - 0.5) < 1e-9, \"sigmoid(0) should be 0.5\")\nbig = sigmoid(np.array([-800.0, 800.0]))\ncheck(np.all(np.isfinite(big)), \"sigmoid must not overflow or produce nan at +/-800\")\ncheck(big[0] < 1e-6 and big[1] > 1 - 1e-6, \"sigmoid should saturate to 0 and 1\")\nz = np.array([-2.0, -0.5, 0.5, 2.0])\ncheck(np.all(np.diff(sigmoid(z)) > 0), \"sigmoid should be increasing\")\n\n# --- fit on separable data\nrng = np.random.default_rng(2)\nn = 300\nX = np.vstack([rng.normal(-2, 1, (n // 2, 2)), rng.normal(2, 1, (n // 2, 2))])\ny = np.concatenate([np.zeros(n // 2), np.ones(n // 2)])\n\nW, b, losses = fit_logistic(X, y, lr=0.1, steps=3000)\ncheck(len(losses) == 3000, f\"expected 3000 losses, got {len(losses)}\")\ncheck(losses[-1] < losses[0], \"cross-entropy should decrease\")\ncheck(losses[-1] < 0.1, f\"final loss should be well under 0.1, got {losses[-1]:.4f}\")\n\nacc = (predict(X, W, b) == y).mean()\ncheck(acc > 0.97, f\"accuracy on separable data should be >97%, got {acc:.3f}\")\n\n# --- generalises to held-out points\nXh = np.vstack([rng.normal(-2, 1, (60, 2)), rng.normal(2, 1, (60, 2))])\nyh = np.concatenate([np.zeros(60), np.ones(60)])\ncheck((predict(Xh, W, b) == yh).mean() > 0.95, \"should generalise to unseen points\")\n\n# --- predict returns labels, not probabilities\nout = np.asarray(predict(X, W, b))\ncheck(set(np.unique(out)).issubset({0, 1, 0.0, 1.0}),\n      \"predict must return hard 0/1 labels, not probabilities\")","hints":["For a numerically safe sigmoid, clip z first: `z = np.clip(z, -500, 500)`.","Probabilities: `p = sigmoid(X @ W + b)`.","Clip before the log: `p = np.clip(p, 1e-12, 1 - 1e-12)`.","Loss: `-np.mean(y * np.log(p) + (1 - y) * np.log(1 - p))`.","Gradient: `dW = (X.T @ (p - y)) / n` \u2014 note there is no factor of 2 here.","`predict` is `(sigmoid(X @ W + b) >= 0.5).astype(int)`."],"solution":"import numpy as np\n\ndef sigmoid(z):\n    z = np.clip(z, -500, 500)\n    return 1.0 / (1.0 + np.exp(-z))\n\ndef fit_logistic(X, y, lr=0.1, steps=3000):\n    n, d = X.shape\n    W = np.zeros(d)\n    b = 0.0\n    losses = []\n    for _ in range(steps):\n        p = sigmoid(X @ W + b)\n        pc = np.clip(p, 1e-12, 1 - 1e-12)\n        losses.append(float(-np.mean(y * np.log(pc) + (1 - y) * np.log(1 - pc))))\n        err = p - y\n        W -= lr * (X.T @ err) / n\n        b -= lr * np.mean(err)\n    return W, b, losses\n\ndef predict(X, W, b):\n    return (sigmoid(X @ W + b) >= 0.5).astype(int)"},"d4-deep":{"title":"Linear algebra I \u2014 build the operations yourself","brief":"## Why you are doing this\n\nYou have been using `@` and `.T` without feeling what they do. Today you\nimplement them in pure Python, then check against numpy. After this, matrix\nshapes stop being something you guess at.\n\n## The three operations\n\n**Dot product** of two vectors \u2014 multiply elementwise, sum the result. It\nmeasures how much two vectors point the same way.\n\n**Matrix multiply** `A @ B` where A is `(n, m)` and B is `(m, p)`. The result is\n`(n, p)`, and entry `[i][j]` is the dot product of **row i of A** with\n**column j of B**. The inner dimensions must match \u2014 that is the whole rule.\n\n**Transpose** \u2014 flip rows and columns. `(n, m)` becomes `(m, n)`.\n\n## Your task\n\nImplement all three in **pure Python** \u2014 lists of lists, no numpy inside your\nfunctions. The tests compare your answers against numpy's.\n\nThen answer, in your own notes: why is `A @ B` almost never equal to `B @ A`?","starter":"def dot(a, b):\n    \"\"\"Dot product of two equal-length lists of numbers. Returns a float.\"\"\"\n    pass\n\ndef transpose(A):\n    \"\"\"A is a list of rows. Return the transpose as a list of rows.\"\"\"\n    pass\n\ndef matmul(A, B):\n    \"\"\"A is (n,m), B is (m,p), both lists of rows. Return (n,p).\n\n    Raise ValueError if the inner dimensions do not match.\n    \"\"\"\n    pass","tests":"import numpy as np\n\ncheck(abs(dot([1, 2, 3], [4, 5, 6]) - 32) < 1e-9, \"dot([1,2,3],[4,5,6]) should be 32\")\ncheck(abs(dot([1, 0], [0, 1])) < 1e-9, \"perpendicular vectors have dot product 0\")\n\nA = [[1, 2, 3], [4, 5, 6]]\ncheck(transpose(A) == [[1, 4], [2, 5], [3, 6]], f\"transpose wrong: {transpose(A)}\")\ncheck(transpose(transpose(A)) == A, \"transposing twice should return the original\")\n\nB = [[7, 8], [9, 10], [11, 12]]\ngot = matmul(A, B)\nwant = (np.array(A) @ np.array(B)).tolist()\ncheck(got == want, f\"matmul wrong: got {got}, numpy says {want}\")\n\nrng = np.random.default_rng(3)\nM1 = rng.integers(-5, 5, (4, 6)).tolist()\nM2 = rng.integers(-5, 5, (6, 3)).tolist()\ncheck(matmul(M1, M2) == (np.array(M1) @ np.array(M2)).tolist(),\n      \"matmul disagrees with numpy on a random 4x6 @ 6x3\")\n\nI3 = [[1, 0, 0], [0, 1, 0], [0, 0, 1]]\ncheck(matmul(A, I3) == A, \"multiplying by the identity should change nothing\")\n\nraised = False\ntry:\n    matmul([[1, 2]], [[1, 2]])       # (1,2) @ (1,2) is illegal\nexcept ValueError:\n    raised = True\ncheck(raised, \"matmul should raise ValueError when inner dimensions disagree\")","hints":["`dot`: `sum(x * y for x, y in zip(a, b))`.","`transpose`: `[[A[r][c] for r in range(len(A))] for c in range(len(A[0]))]`.","For matmul, get the columns of B by transposing it first \u2014 then every entry is a dot product.","Inner dimensions: `len(A[0])` must equal `len(B)`.","matmul result has `len(A)` rows and `len(B[0])` columns."],"solution":"def dot(a, b):\n    return float(sum(x * y for x, y in zip(a, b)))\n\ndef transpose(A):\n    return [[A[r][c] for r in range(len(A))] for c in range(len(A[0]))]\n\ndef matmul(A, B):\n    if len(A[0]) != len(B):\n        raise ValueError(f\"inner dimensions disagree: {len(A[0])} vs {len(B)}\")\n    Bt = transpose(B)\n    return [[dot(row, col) for col in Bt] for row in A]"},"d5-deep":{"title":"Linear algebra II \u2014 the closed-form solution","brief":"## There is an exact answer\n\nGradient descent *approaches* the best line. For linear regression you can also\ncompute it **exactly**, in one step, with the normal equation:\n\n```\nW = (X\u1d40 X)\u207b\u00b9 X\u1d40 y\n```\n\n## Why bother, if we have gradient descent?\n\nTwo reasons, and the second is the important one.\n\n**It gives you ground truth.** You can now check whether your gradient descent\nactually converged to the right answer, instead of hoping.\n\n**It shows you why gradient descent exists.** Inverting `X\u1d40X` costs roughly\nO(d\u00b3) for d features. At d = 100 that is nothing. At d = 1,000,000 \u2014 which is a\nsmall neural network \u2014 it is impossible. Gradient descent is what you use when\nthe exact answer exists but you cannot afford to compute it.\n\nThat is the trade the whole field runs on.\n\n## The intercept\n\nThe formula has no `b`. The standard trick: append a column of 1s to X. That\ncolumn's weight *is* the intercept, because `1 \u00b7 b = b`.\n\n## Your task\n\nImplement `normal_equation(X, y)` returning `(W, b)`, where X is `(n, d)`\n**without** a bias column \u2014 you add it inside.\n\nUse `np.linalg.solve`, not `np.linalg.inv`. Explicitly inverting is slower and\nnumerically worse; solving the system directly is what you should always reach\nfor.","starter":"import numpy as np\n\ndef normal_equation(X, y):\n    \"\"\"Exact least-squares fit. X:(n,d) without bias column, y:(n,)\n\n    Return (W, b) where W has shape (d,).\n    \"\"\"\n    pass","tests":"import numpy as np\nrng = np.random.default_rng(4)\nn, d = 500, 4\nX = rng.normal(0, 1, (n, d))\nW_true = np.array([1.5, -2.0, 0.75, 3.0])\nb_true = -1.25\ny = X @ W_true + b_true + rng.normal(0, 0.01, n)\n\nW, b = normal_equation(X, y)\nW = np.asarray(W)\n\ncheck(W.shape == (4,), f\"W should have shape (4,), got {W.shape}\")\ncheck(np.allclose(W, W_true, atol=0.01), f\"W should be about {W_true}, got {np.round(W,4)}\")\ncheck(abs(b - b_true) < 0.01, f\"b should be about {b_true}, got {b:.4f}\")\n\n# must agree with numpy's own least-squares\nXb = np.hstack([X, np.ones((n, 1))])\nref = np.linalg.lstsq(Xb, y, rcond=None)[0]\ncheck(np.allclose(np.append(W, b), ref, atol=1e-6),\n      \"your solution should match np.linalg.lstsq to high precision\")\n\n# exact fit on noiseless data\nX2 = rng.normal(0, 1, (50, 2))\ny2 = X2 @ np.array([2.0, -1.0]) + 5.0\nW2, b2 = normal_equation(X2, y2)\ncheck(np.allclose(np.asarray(W2), [2.0, -1.0], atol=1e-8) and abs(b2 - 5.0) < 1e-8,\n      \"with no noise the fit should be exact to ~1e-8\")","hints":["Add the bias column: `Xb = np.hstack([X, np.ones((len(X), 1))])`.","Build the system: `A = Xb.T @ Xb` and `rhs = Xb.T @ y`.","Solve it: `theta = np.linalg.solve(A, rhs)` \u2014 do not use `np.linalg.inv`.","The last entry of theta is b; everything before it is W.","`W, b = theta[:-1], float(theta[-1])`."],"solution":"import numpy as np\n\ndef normal_equation(X, y):\n    Xb = np.hstack([X, np.ones((len(X), 1))])\n    theta = np.linalg.solve(Xb.T @ Xb, Xb.T @ y)\n    return theta[:-1], float(theta[-1])"},"d6-deep":{"title":"Week-1 rebuild \u2014 from a blank file","brief":"## This is the real test of the week\n\nEverything below, from memory. **Close the other exercises. Do not look at your\nearlier code.** If you cannot do this, you did not learn it \u2014 you followed it,\nwhich feels identical and is not the same thing.\n\nRebuild:\n\n1. `fit_linear(x, y, lr, steps)` \u2014 single feature, returns `(w, b, losses)`\n2. `fit_logistic(X, y, lr, steps)` \u2014 returns `(W, b, losses)`, cross-entropy\n3. `predict(X, W, b)` \u2014 hard 0/1 labels\n4. `normal_equation(X, y)` \u2014 returns `(W, b)`\n\nYou will need `sigmoid` too.\n\n## If you get stuck\n\nDo not open the solution. Derive the gradient on paper again. The gradient is\nthe thing you are actually learning this week; everything else is typing.\n\n## When it passes\n\nWrite one paragraph in your repo: what did you have to look up, and what came\nback on its own? That gap is your revision list for next week.","starter":"import numpy as np\n\n# From memory. No references.\n\ndef fit_linear(x, y, lr=0.05, steps=3000):\n    pass\n\ndef sigmoid(z):\n    pass\n\ndef fit_logistic(X, y, lr=0.1, steps=3000):\n    pass\n\ndef predict(X, W, b):\n    pass\n\ndef normal_equation(X, y):\n    pass","tests":"import numpy as np\nrng = np.random.default_rng(7)\n\n# 1. linear\nx = rng.uniform(-3, 3, 200)\ny = -1.5 * x + 4.0 + rng.normal(0, 0.1, 200)\nw, b, losses = fit_linear(x, y, lr=0.05, steps=3000)\ncheck(abs(w + 1.5) < 0.1, f\"linear w should be about -1.5, got {w:.4f}\")\ncheck(abs(b - 4.0) < 0.1, f\"linear b should be about 4.0, got {b:.4f}\")\ncheck(len(losses) == 3000 and losses[-1] < losses[0], \"losses should be recorded and decrease\")\n\n# 2. sigmoid\ncheck(abs(sigmoid(np.array([0.0]))[0] - 0.5) < 1e-9, \"sigmoid(0) should be 0.5\")\ncheck(np.all(np.isfinite(sigmoid(np.array([-900.0, 900.0])))), \"sigmoid must not overflow\")\n\n# 3. logistic\nn = 300\nX = np.vstack([rng.normal(-2, 1, (n//2, 2)), rng.normal(2, 1, (n//2, 2))])\nyc = np.concatenate([np.zeros(n//2), np.ones(n//2)])\nW, bb, lo = fit_logistic(X, yc, lr=0.1, steps=3000)\ncheck(lo[-1] < 0.1, f\"cross-entropy should end under 0.1, got {lo[-1]:.4f}\")\ncheck((predict(X, W, bb) == yc).mean() > 0.97, \"logistic accuracy should exceed 97%\")\n\n# 4. normal equation\nXn = rng.normal(0, 1, (300, 3))\nWt = np.array([2.0, -1.0, 0.5])\nyn = Xn @ Wt + 3.0\nWn, bn = normal_equation(Xn, yn)\ncheck(np.allclose(np.asarray(Wn), Wt, atol=1e-6), \"normal equation W is wrong\")\ncheck(abs(bn - 3.0) < 1e-6, \"normal equation b is wrong\")\n\n# 5. the two methods must agree\nXg = rng.normal(0, 1, (300, 1))\nyg = (Xg[:, 0] * 2.0) + 1.0 + rng.normal(0, 0.01, 300)\nwg, bg, _ = fit_linear(Xg[:, 0], yg, lr=0.1, steps=5000)\nWne, bne = normal_equation(Xg, yg)\ncheck(abs(wg - float(np.asarray(Wne)[0])) < 0.02,\n      \"gradient descent and the normal equation should reach the same answer\")","hints":["Start with the loss. If you can write the loss, the gradient follows.","Squared error for regression; cross-entropy for classification.","Both gradients reduce to X-transpose times the error, divided by n.","If you are truly stuck on one, do the others first and come back."],"solution":"import numpy as np\n\ndef fit_linear(x, y, lr=0.05, steps=3000):\n    w, b, losses = 0.0, 0.0, []\n    for _ in range(steps):\n        err = (w * x + b) - y\n        losses.append(float(np.mean(err ** 2)))\n        w -= lr * 2.0 * np.mean(err * x)\n        b -= lr * 2.0 * np.mean(err)\n    return w, b, losses\n\ndef sigmoid(z):\n    return 1.0 / (1.0 + np.exp(-np.clip(z, -500, 500)))\n\ndef fit_logistic(X, y, lr=0.1, steps=3000):\n    n, d = X.shape\n    W, b, losses = np.zeros(d), 0.0, []\n    for _ in range(steps):\n        p = sigmoid(X @ W + b)\n        pc = np.clip(p, 1e-12, 1 - 1e-12)\n        losses.append(float(-np.mean(y * np.log(pc) + (1 - y) * np.log(1 - pc))))\n        err = p - y\n        W -= lr * (X.T @ err) / n\n        b -= lr * np.mean(err)\n    return W, b, losses\n\ndef predict(X, W, b):\n    return (sigmoid(X @ W + b) >= 0.5).astype(int)\n\ndef normal_equation(X, y):\n    Xb = np.hstack([X, np.ones((len(X), 1))])\n    theta = np.linalg.solve(Xb.T @ Xb, Xb.T @ y)\n    return theta[:-1], float(theta[-1])"}};
const KEY = 'aibootcamp.v1';

/* Storage can throw in a sandboxed frame or with cookies blocked.
   Never let that take the whole page down — fall back to memory. */
const store = (() => {
  try { localStorage.setItem('__t','1'); localStorage.removeItem('__t');
        return localStorage; }
  catch(e){ let m = {}; return {getItem:k=>k in m?m[k]:null, setItem:(k,v)=>{m[k]=v}}; }
})();
let state;
try { state = JSON.parse(store.getItem(KEY)) || {done:{}, idx:null}; }
catch(e){ state = {done:{}, idx:null}; }
if (!state.done) state.done = {};
if (!state.passed) state.passed = {};   // taskId -> true once tests go green
if (!state.code) state.code = {};       // taskId -> your saved source
if (!state.unverified) state.unverified = {};
const save = () => { try { store.setItem(KEY, JSON.stringify(state)); } catch(e){} };
const days = DATA.days;

function todayIdx(){
  const t = new Date(); t.setHours(0,0,0,0);
  const iso = t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
  const i = days.findIndex(d => d.date === iso);
  if (i >= 0) return i;
  return iso < days[0].date ? 0 : days.length - 1;
}
let idx = state.idx !== null && state.idx !== undefined ? state.idx : todayIdx();

const fmtDate = iso => {
  const [y,m,dd] = iso.split('-').map(Number);
  return new Date(y, m-1, dd).toLocaleDateString(undefined,
    {weekday:'long', day:'numeric', month:'long'});
};
const isDone = id => !!state.done[id];

function dayDone(d){ return d.tasks.every(t => isDone(t.id)); }

function streak(){
  let s = 0;
  for (let i = Math.min(idx, days.length-1); i >= 0; i--){
    if (days[i].date > days[todayIdx()].date) continue;
    if (dayDone(days[i])) s++; else break;
  }
  return s;
}

  document.getElementById('theme').textContent = d.theme;
  const mins = d.tasks.filter(t=>t.cat!=='audio').reduce((a,t)=>a+t.mins,0);

  document.getElementById('daymeta').textContent =
    `${(mins/60).toFixed(1)} h focused` + (audio ? ` · ${(audio/60).toFixed(1)} h audio while driving` : '');

  document.getElementById('gate').innerHTML = d.isGate
    ? `<div class="gatebanner"><b>ASSESSMENT DAY</b><span>No references, no help. This measures what actually stuck — a bad result is information, not failure.</span></div>` : '';

  const blocks = {};
  d.tasks.forEach(t => { (blocks[t.block] = blocks[t.block] || []).push(t); });
  document.getElementById('blocks').innerHTML = Object.entries(blocks).map(([name, ts]) => `

      <div class="block-h"><h2>${name}</h2><span class="mins">${
        (ts.reduce((a,t)=>a+t.mins,0)/60).toFixed(1)} h</span></div>

        <div class="task ${isDone(t.id)?'done':''}" data-id="${t.id}">
          <div class="task-row">
            <button class="check" data-check="${t.id}" aria-label="Toggle done">

                stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
            </button>
            <div class="task-main">
              <div class="task-title">${t.title}</div>
              <div class="task-tags">
                <span class="chip cat-${t.cat}">${t.cat}</span>
                <span class="chip">${t.mins} min</span>
              </div>
            </div>
            <span class="expand">▾</span>
          </div>
          <div class="detail">${t.detail}
            ${EX[t.id] ? `<div><button class="exbtn ${state.passed[t.id]?'passed':''}"
                data-ex="${t.id}">${state.passed[t.id]
                ? '✓ Tests passing — reopen' : '⌨ Open the exercise'}</button></div>
              ${state.passed[t.id] ? '' :
                '<div class="lockmsg">This task has a coding exercise with tests. '
                + 'The box ticks itself when they pass.</div>'}` : ''}
            ${t.cat === 'audio' ? '' : `<div><button class="timer-btn" data-timer="${
              Math.min(t.mins, 25)}" data-title="${t.title.replace(/"/g,'&quot;')}">▶ Start ${
              Math.min(t.mins, 25)}-min focus block</button></div>`}
          </div>
        </div>`).join('')}
    </section>`).join('');

  document.getElementById('complete').innerHTML = dayDone(d)
    ? `<div class="complete"><b>Day complete</b><span>${(mins/60).toFixed(1)} hours logged. Rest — tomorrow is Day ${idx+2}.</span></div>` : '';

  document.getElementById('stDone').textContent = doneAll;
  document.getElementById('stHours').textContent = Math.round(
    allTasks.filter(t=>isDone(t.id)).reduce((a,t)=>a+t.mins,0)/60);
  document.getElementById('stDay').textContent = `${idx+1}/${days.length}`;

  document.getElementById('phases').innerHTML = DATA.phases.map(p => {
    const ts = days.filter(x=>x.phase===p.n).flatMap(x=>x.tasks);
    const dn = ts.filter(t=>isDone(t.id)).length;
    const pct = Math.round(100*dn/ts.length);
    return `<div class="ph">
      <span class="phase-dot" style="background:${p.color}"></span>
      <span class="ph-name">${p.name}</span>
      <span class="ph-bar"><span style="width:${pct}%;background:${p.color}"></span></span>
      <span class="ph-pct mono">${pct}%</span></div>`;
  }).join('');

  document.getElementById('prev').disabled = idx === 0;
  document.getElementById('next').disabled = idx === days.length - 1;
  state.idx = idx; save();
}

document.addEventListener('click', e => {
  const c = e.target.closest('[data-check]');
  if (c){ const id = c.dataset.check;
    if (state.done[id]) { delete state.done[id]; delete state.unverified[id]; }
    else {
      // A task with an exercise is not "done" on your say-so. Tests decide.
      if (EX[id] && !state.passed[id]) {
        if (!confirm('This task has tests and they have not passed yet.\n\n'
            + 'Open the exercise instead?\n\nCancel = mark it done anyway '
            + '(it will be flagged as unverified).')) {
          state.done[id] = Date.now(); state.unverified[id] = true;
        } else { openEx(id); return; }
      } else state.done[id] = Date.now();
    }
    save(); render(); return; }
  const xb = e.target.closest('[data-ex]');
  if (xb){ openEx(xb.dataset.ex); return; }
  const tb = e.target.closest('[data-timer]');
  if (tb){ startTimer(+tb.dataset.timer, tb.dataset.title); return; }
  const t = e.target.closest('.task');
  if (t && !e.target.closest('.timer-btn')) t.classList.toggle('open');
});

document.getElementById('prev').onclick = () => { if(idx>0){idx--;render();window.scrollTo(0,0);} };
document.getElementById('next').onclick = () => { if(idx<days.length-1){idx++;render();window.scrollTo(0,0);} };
document.getElementById('todayBtn').onclick = () => { idx = todayIdx(); render(); window.scrollTo(0,0); };

/* theme */
const themeBtn = document.getElementById('themeBtn');
themeBtn.onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : cur === 'light' ? '' : 'dark';
  if (next) document.documentElement.setAttribute('data-theme', next);
  else document.documentElement.removeAttribute('data-theme');
  state.theme = next; save();
};
if (state.theme) document.documentElement.setAttribute('data-theme', state.theme);

/* timer */
let tInt = null, tLeft = 0, tPaused = false;
function startTimer(mins, title){
  tLeft = mins*60; tPaused = false;
  document.getElementById('tTask').textContent = title;
  document.getElementById('timer').classList.add('on');
  document.getElementById('tPause').textContent = 'Pause';
  tick(); clearInterval(tInt);
  tInt = setInterval(() => { if(!tPaused){ tLeft--; tick();
    if (tLeft <= 0){ clearInterval(tInt); document.getElementById('tTime').textContent = 'DONE'; } } }, 1000);
}
function tick(){
  const m = Math.floor(Math.max(tLeft,0)/60), s = Math.max(tLeft,0)%60;
  document.getElementById('tTime').textContent =
    String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
document.getElementById('tPause').onclick = () => {
  tPaused = !tPaused;
  document.getElementById('tPause').textContent = tPaused ? 'Resume' : 'Pause';
};
document.getElementById('tStop').onclick = () => {
  clearInterval(tInt); document.getElementById('timer').classList.remove('on');
};

/* ---------------------------------------------------------------- exercises */
let curEx = null, pyodide = null, pyLoading = null;

function md(src){
  const blocks = [];
  // pull fenced code out first so paragraph joining cannot touch it
  let s = src.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
             .replace(/```\n?([\s\S]*?)```/g, (m,c) => {
               blocks.push(`<pre><code>${c.replace(/\n+$/,'')}</code></pre>`);
               return `␀${blocks.length-1}␀`;
             });
  const html = s.split(/\n{2,}/).map(para => {
    const t = para.trim();
    if (!t) return '';
    if (/^␀\d+␀$/.test(t)) return t;              // a code block
    if (t.startsWith('## ')) return `<h2>${inline(t.slice(3))}</h2>`;
    // join wrapped lines into one paragraph, keep list items on their own line
    if (/^[-*\d]/.test(t) && t.includes('\n'))
      return `<p>${t.split('\n').map(l=>inline(l.trim())).join('<br>')}</p>`;
    return `<p>${inline(t.replace(/\n/g,' '))}</p>`;
  }).join('');
  return html.replace(/␀(\d+)␀/g, (m,i) => blocks[+i]);
}
function inline(t){
  return t.replace(/`([^`]+)`/g,'<code>$1</code>')
          .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
          .replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g,'<em>$1</em>');
}

function openEx(id){
  const e = EX[id]; if (!e) return;
  curEx = id;
  document.getElementById('exTitle').textContent = e.title;
  document.getElementById('paneBrief').innerHTML = `<div class="brief">${md(e.brief)}</div>`;
  document.getElementById('code').value = state.code[id] || e.starter;
  document.getElementById('results').innerHTML = '';
  document.getElementById('paneHints').innerHTML = e.hints.map((h,i)=>
    `<div class="hint"><b>HINT ${i+1}</b>${md(h).replace(/<\/?p>/g,'')}</div>`).join('');
  document.getElementById('paneSol').innerHTML =
    `<div class="solwarn"><strong>Try it properly first.</strong> Reading the solution
     before you have struggled is the fastest way to feel like you learned something
     and retain nothing. Use the hints. Come back tomorrow if you must.</div>
     <div class="brief"><pre><code>${e.solution
       .replace(/&/g,'&amp;').replace(/</g,'&lt;')}</code></pre></div>`;
  showPane('brief');
  document.getElementById('ex').classList.add('on');
}
function showPane(name){
  document.querySelectorAll('.ex-tabs button').forEach(b =>
    b.classList.toggle('sel', b.dataset.pane === name));
  const map = {brief:'paneBrief', code:'paneCode', hints:'paneHints', sol:'paneSol'};
  Object.entries(map).forEach(([k,v]) =>
    document.getElementById(v).classList.toggle('sel', k === name));
  document.querySelector('.ex-body').scrollTop = 0;
}
document.querySelectorAll('.ex-tabs button').forEach(b =>
  b.onclick = () => showPane(b.dataset.pane));
document.getElementById('exClose').onclick = () => {
  if (curEx) { state.code[curEx] = document.getElementById('code').value; save(); }
  document.getElementById('ex').classList.remove('on'); curEx = null; render();
};
document.getElementById('resetBtn2').onclick = () => {
  if (curEx && confirm('Replace your code with the starter template?'))
    document.getElementById('code').value = EX[curEx].starter;
};
document.getElementById('code').addEventListener('keydown', ev => {
  if (ev.key === 'Tab'){ ev.preventDefault();
    const t = ev.target, s = t.selectionStart;
    t.value = t.value.slice(0,s) + '    ' + t.value.slice(t.selectionEnd);
    t.selectionStart = t.selectionEnd = s + 4; }
});

async function getPy(){
  if (pyodide) return pyodide;
  if (pyLoading) return pyLoading;
  const st = document.getElementById('pyStatus');
  pyLoading = (async () => {
    st.textContent = 'Loading Python (first run only, ~15s)…';
    if (!window.loadPyodide){
      await new Promise((res, rej) => {
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js';
        s.onload = res; s.onerror = () => rej(new Error('could not load Python'));
        document.head.appendChild(s);
      });
    }
    const py = await loadPyodide({indexURL:'https://cdn.jsdelivr.net/pyodide/v0.26.2/full/'});
    st.textContent = 'Loading numpy…';
    await py.loadPackage('numpy');
    st.textContent = '';
    pyodide = py; return py;
  })();
  return pyLoading;
}

document.getElementById('runBtn').onclick = async () => {
  if (!curEx) return;
  const btn = document.getElementById('runBtn');
  const out = document.getElementById('results');
  const st  = document.getElementById('pyStatus');
  const src = document.getElementById('code').value;
  state.code[curEx] = src; save();
  btn.disabled = true; out.innerHTML = '';
  let py;
  try { py = await getPy(); }
  catch(err){
    btn.disabled = false; st.textContent = '';
    out.innerHTML = `<div class="res fail"><span class="ic">!</span><span class="msg">
      Could not load Python — you need to be online the first time. Run your code in
      VS Code instead; the tests are in the Problem tab.</span></div>`;
    return;
  }
  st.textContent = 'Running…';
  py.globals.set('_student_src', src);
  py.globals.set('_test_src', EX[curEx].tests);
  let report;
  try {
    report = py.runPython(`
import json, traceback
_res = []
def check(cond, msg=""):
    _res.append({"ok": bool(cond), "msg": msg})
_ns = {"check": check}
_err = None
try:
    exec(_student_src, _ns)
except Exception:
    _err = "Your code raised before tests ran:\\n" + traceback.format_exc()
if _err is None:
    try:
        exec(_test_src, _ns)
    except Exception:
        _err = "A test raised:\\n" + traceback.format_exc()
json.dumps({"results": _res, "error": _err})
`);
  } catch(err){ report = JSON.stringify({results:[], error:String(err)}); }
  st.textContent = '';
  btn.disabled = false;

  const {results, error} = JSON.parse(report);
  let html = results.map((r,i) => `<div class="res ${r.ok?'pass':'fail'}">
      <span class="ic">${r.ok?'✓':'✕'}</span>
      <span class="msg">${r.ok ? 'Check '+(i+1)+' passed'
        : (r.msg || 'Check '+(i+1)+' failed').replace(/</g,'&lt;')}</span></div>`).join('');
  if (error) html += `<div class="res fail"><span class="ic">!</span>
      <span class="msg"><pre style="white-space:pre-wrap;margin:0">${
      error.replace(/</g,'&lt;')}</pre></span></div>`;

  const passed = !error && results.length > 0 && results.every(r => r.ok);
  if (passed){
    html += `<div class="allpass">All ${results.length} checks passed — task complete</div>`;
    state.passed[curEx] = true;
    state.done[curEx] = Date.now();
    delete state.unverified[curEx];
    save();
  }
  out.innerHTML = html;
};

/* export / import / reset */
document.getElementById('exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify(state)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'bootcamp-progress.json'; a.click();
};
document.getElementById('importBtn').onclick = () => {
  const i = document.createElement('input'); i.type = 'file'; i.accept = '.json';
  i.onchange = () => { const f = i.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => { try { state = JSON.parse(r.result); save(); idx = todayIdx(); render(); }
      catch(err){ alert('Could not read that file.'); } };
    r.readAsText(f); };
  i.click();
};
document.getElementById('resetBtn').onclick = () => {
  if (confirm('Clear all progress? This cannot be undone.')){
    state = {done:{}, idx:null}; save(); idx = todayIdx(); render(); }
};

render();
</script>
